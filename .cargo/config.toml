# NOTE: this file deliberately patches nothing. To build against the sibling
# twig checkout instead, use the org-wide switch: copy
# ~/diaryx/.cargo/patches.toml to ~/diaryx/.cargo/config.toml and uncomment
# `twig-doc` and the language crates (that untracked file). Cargo merges config
# from every ancestor directory, so it reaches this checkout without a tracked
# file changing.

# `cargo xtask <task>` — the workspace task runner (xtask/). It builds and runs
# the frontends whose build leaves Rust (the Apple app over packages/leaf-swift,
# the wasm web demo), and the checks too big for one command that `ship ci`
# calls. `cargo xtask --help` lists them.
[alias]
xtask = "run --quiet --package xtask --"
