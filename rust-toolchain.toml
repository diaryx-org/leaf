# The org's Rust pin. It was set here first, for gpui (archived), which
# uses library features that stabilised in 1.95.
#
# Above 1.95.0 itself because macOS 27's dyld refuses some proc-macro dylibs
# that 1.95's rustc links ("mis-aligned LINKEDIT string pool"; rustc reports it
# as `can't find crate`). 1.98 links them acceptably. diaryx-org/nix's
# `versions.rust` explains it at length.
#
# It is also the number diaryx-org/nix publishes as `versions.rust` for the whole
# org, for this reason and named as leaf's. The two are meant to agree.
[toolchain]
channel = "1.98.1"
profile = "minimal"
# `minimal` is rustc, cargo, and rust-std — deliberately, since that is all a
# build needs. But `ship ci` is this repo's CI and its jobs include rustfmt
# and clippy, so a toolchain rustup auto-installed from this file could
# not run the checks a release has to pass:
#
#     error: 'cargo-fmt' is not installed for the toolchain '1.98.1-...'
#
# Naming them here is what makes that self-healing: rustup installs a missing
# declared component on next use, so a fresh machine, a second RUSTUP_HOME, or a
# new contributor gets a toolchain that can run CI without being told to. It
# stays `minimal` plus these two rather than `default`, which would also pull
# rust-docs and rust-analyzer that nothing here calls.
components = ["rustfmt", "clippy"]
