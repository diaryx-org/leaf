# What the shared release tooling needs to know about leaf. Everything not
# stated here is a default in lib/repo.nu — the manifest, the changelog path,
# the cliff config, and that this is a Cargo workspace.
name = "leaf"
url = "https://github.com/diaryx-org/leaf"
release_branch = "main"

# What to run before cutting. Each repo owns its own CI; this names it.
verify = "cargo xtask ci"

# What pushing the tag sets off, most consequential first. The warning printed
# before the push is handed back to you is composed from these.
#
# This is leaf's only tag workflow. crates.io is still not one of them: every
# upload there is `cargo publish --workspace`, run deliberately by hand, and a
# tag does not trigger it.
[[tag_starts]]
workflow = "homebrew.yml"
does = "builds the `leaf` CLI binaries and writes the tap formula"
