# git-cliff configuration for leaf.
#
# One consumer, and it is a program rather than a person: `cargo xtask changelog`
# regenerates the marked region inside `docs/CHANGELOG.md`'s `## Unreleased`
# section, and `cargo xtask release` renders that same region one last time —
# under the version being cut — before moving it down into a released section.
# Nothing else reads this file, so the template below is written for a changelog
# bullet and nothing else.
#
# The **Behavioural changes** section is generated too, from `Behavioural-change:`
# trailers rather than from subjects. The rule that section answers — "would a
# caller who upgrades without editing a line of their own code observe a
# difference" — is a judgment about the change, and no subject can carry it: a
# `fix:` can be behavioural and an `add:` can be silently behavioural. Asking the
# author to write it as a trailer keeps the judgment where it has to be made — at
# the commit, by the person holding the context.
#
# leaf's consumers are three embedders and a host app (leaf-ratatui in a TUI,
# leaf-gpui in a gpui window, leaf-ffi in Swift, leaf-wasm in a browser), so the
# difference worth recording is usually one in the model: a span that moves, a
# view struct that gains a field, a key that stops being handled.
#
#     Behavioural-change: `Doc::visual_map` no longer emits a run for an empty
#       trailing line. It used to emit one of zero width; a renderer that keyed
#       off run count will see one fewer.
#
# Still handwritten, and deliberately: a release INTRO, for a release that needs
# a narrative rather than a list. It goes in the released section under the
# heading `cargo xtask release` writes, below the end marker, where regeneration
# cannot reach it.

[changelog]
header = ""
footer = ""
trim = true

# One `### Group` per bucket, commits as bullets. Scope is surfaced because
# leaf's subjects lean on it (`fix(core)`, `add(leaf-swift)`) to say which
# surface moved — and in a workspace of five crates and three frontends, that
# scope is what tells a reader whether the change is theirs. The short hash makes
# a bullet traceable back to the diff during triage.
#
# Then one **Behavioural changes** section for the whole release, collected from
# every `Behavioural-change:` trailer in commit order. It comes last because it
# is what a consumer upgrading reads first-and-only: the groups above say what
# moved, this says what will break under them. Gathered into a list before
# rendering so the heading appears only when there is something under it — a
# release with no observable difference should not advertise an empty section.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}** — {% endif %}{{ commit.message }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/diaryx-org/leaf/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{%- set_global notes = [] -%}
{%- for commit in commits -%}
{#- `default`, because a commit whose subject git-conventional cannot parse
    (a wrapped one, say) carries no `footers` key at all rather than an empty
    one, and an unguarded access aborts the whole render. -#}
{%- for f in commit.footers | default(value=[]) -%}
{%- if f.token == "Behavioural-change" -%}
{%- set_global notes = notes | concat(with=f.value) -%}
{%- endif -%}
{%- endfor -%}
{%- endfor -%}
{% if notes | length > 0 %}
### Behavioural changes
{% for n in notes %}
- {{ n | trim }}
{% endfor %}
{%- endif %}"""

[git]
conventional_commits = true
# leaf's history predates any convention and still carries `prepare for publish`
# and `Update .gitignore` style subjects. Keeping unconventional commits in
# (rather than dropping them) is what lets the catch-all parser below surface
# them for triage instead of silently losing them.
filter_unconventional = false
filter_commits = false
protect_breaking_commits = true
split_commits = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"

commit_preprocessors = [
  # Much of leaf's log spells the house convention with the colon dropped —
  # `add(swift) a picture that isn't here yet is the app's to fetch` — and
  # git-conventional reads that as unparseable. An unparseable subject costs more
  # than a bucket: git-cliff then has no idea where the subject ends, so the
  # ENTIRE commit body lands in the bullet, and any `Behavioural-change:` trailer
  # below it is never seen as a trailer at all. Putting the colon back before
  # parsing rescues the whole history rather than only what is committed from
  # here on. The type list is closed on purpose: a subject starting with any
  # other word is off-convention and should reach the triage bucket, not be
  # silently promoted into `Added`.
  { pattern = '^(?P<type>add|feat|fix|docs|chore|refactor|perf|polish|test|ci|build|style)(?P<scope>\([^)\n]*\))?(?P<bang>!)?[ \t]+(?P<rest>[^\s:])', replace = "${type}${scope}${bang}: ${rest}" },
  # Trailing period on a SUBJECT reads wrong once it is a bullet. Anchored to the
  # first line, because a preprocessor sees the whole message: an end-of-STRING
  # anchor would leave the subject alone on any multi-line commit and quietly eat
  # the last period of the body — which, where `Behavioural-change:` trailers
  # live, would truncate the last sentence a consumer reads.
  { pattern = '^(?P<subject>[^\n]*?)[ \t]*\.[ \t]*(?P<rest>\n|$)', replace = "${subject}${rest}" },
  # A bare `<div>` in a subject is HTML once the bullet is rendered, and the word
  # disappears. leaf's subjects name markup constantly, so this one earns its
  # place. Backtick anything angle-bracketed that isn't already.
  { pattern = '(?P<pre>[^`])<(?P<tag>[a-zA-Z/][^<>\s]*)>', replace = "${pre}`<${tag}>`" },
]

# First match wins, so the `!` breaking rule has to precede the type rules. leaf
# spells additions `add(scope):` as often as `feat(scope):`; both are accepted so
# older commits and any muscle memory land in the same bucket, and `polish` rides
# with `refactor` for the same reason.
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^chore: (release|bump)', skip = true },
  { message = '^[a-zA-Z]+(\(.+\))?!:', group = "<0>Breaking" },
  { message = '^(add|feat)', group = "<1>Added" },
  { message = '^fix', group = "<2>Fixed" },
  { message = '^(refactor|perf|polish)', group = "<3>Changed" },
  { message = '^docs', skip = true },
  { message = '^(chore|test|ci|build|style)', skip = true },
  { message = '^(merge|Merge)', skip = true },
  # Anything left is off-convention. It gets a visible bucket rather than a
  # silent drop, so the author decides where it belongs.
  { message = '.*', group = "<9>Uncategorised — triage before release" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
