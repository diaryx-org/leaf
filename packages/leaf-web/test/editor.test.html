<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>leaf-web · tests</title>
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 0; padding: 16px 20px;
    background: #14161b; color: #d7dce5; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #summary { padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; font-weight: 700; }
  #summary.pass { background: #1d3f34; color: #7fd1c1; }
  #summary.fail { background: #45222a; color: #ff9d9d; }
  li { list-style: none; }
  li.pass::before { content: "ok   "; color: #7fd1c1; }
  li.fail::before { content: "FAIL "; color: #ff8888; }
  li.fail { color: #ff9d9d; }
  .why { color: #8b93a3; padding-left: 5ch; }
  /* The editor mounts here. Given a real size, because the wrap-fitting tests
     measure it — a zero-width box would make every one of them vacuous. */
  #mount { width: 700px; height: 320px; margin-top: 16px; outline: 1px dashed #333; }
</style>
</head>
<body>
<h1>leaf-web · editor tests</h1>
<div id="summary">running…</div>
<ul id="results"></ul>
<div id="mount"></div>

<script type="module">
// Tests for the half of leaf-web that Rust cannot reach: the DOM projection and
// the input plumbing. They run in a real browser against the real wasm, because
// that is the only place a `TreeWalker`, a `Range`, a native selection, and a
// laid-out proportional font all behave the way the editor depends on. A stub
// DOM would mostly be testing the stub.
//
// Run with `cargo xtask web --test`, which serves this page and opens it. The
// page reports into `document.title` and `window.__results` as well as on
// screen, so an automated driver can read the outcome without scraping.
import { LeafEditor } from "../src/index.js";

const results = [];
const list = document.getElementById("results");

function record(name, error) {
  results.push({ name, ok: !error, error: error ? String(error.message || error) : null });
  const li = document.createElement("li");
  li.className = error ? "fail" : "pass";
  li.textContent = name;
  list.appendChild(li);
  if (error) {
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = String(error.message || error);
    list.appendChild(why);
  }
}

async function test(name, fn) {
  let ed = null;
  try {
    ed = await fn();
    record(name, null);
  } catch (e) {
    record(name, e);
  } finally {
    try { ed?.destroy?.(); } catch { /* a test that failed mid-construction */ }
  }
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || "assertion failed");
}
function eq(actual, expected, msg) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((msg ? msg + ": " : "") + `expected ${b}, got ${a}`);
}

/** A fresh editor on the shared mount, so each test starts from a clean surface. */
function editor(source, opts = {}) {
  const mount = document.getElementById("mount");
  mount.innerHTML = "";
  return new LeafEditor(mount, { source, format: "markdown", ...opts });
}

/** Put the browser's selection at a DOM point, as a click would. */
function place(node, offset) {
  const r = document.createRange();
  r.setStart(node, offset);
  r.collapse(true);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

/** The first text node inside a run of `el`. */
function firstText(el) {
  const t = el.querySelector(".leaf-run");
  assert(t, "no run inside the element");
  return t.firstChild;
}

/** Dispatch a real editing intent, the way a keystroke does. */
function input(ed, inputType, data) {
  return ed.contentEl.dispatchEvent(
    new InputEvent("beforeinput", { inputType, data, bubbles: true, cancelable: true })
  );
}

const TABLE_DOC = [
  "# Grid",
  "",
  "| Frontend | Draws | Align |",
  "|---|---|:-:|",
  "| leaf-tui | picture | a |",
  "| leaf-web | its own | b |",
  "",
  "After the table.",
  "",
].join("\n");

await LeafEditor.init();

// ── the projection ────────────────────────────────────────────────────────

await test("a table renders as a grid, not as box glyphs", () => {
  const ed = editor(TABLE_DOC);
  const table = ed.contentEl.querySelector("table.leaf-table");
  assert(table, "no <table> was built");
  eq(table.rows.length, 3, "header plus two body rows");
  eq([...table.rows[0].cells].map((c) => c.tagName), ["TH", "TH", "TH"]);
  eq([...table.rows[1].cells].map((c) => c.textContent), ["leaf-tui", "picture", "a"]);
  assert(
    !/[┌│├└┬┴┼─]/.test(ed.contentEl.textContent),
    "the monospace picture is still being painted alongside the grid"
  );
  return ed;
});

await test("a column's alignment reaches the cell", () => {
  const ed = editor(TABLE_DOC);
  const head = ed.contentEl.querySelector("table.leaf-table").rows[0];
  eq([...head.cells].map((c) => c.style.textAlign || "-"), ["-", "-", "center"]);
  return ed;
});

await test("a repaint replaces the grid rather than stacking another under it", () => {
  const ed = editor(TABLE_DOC);
  eq(ed.contentEl.querySelectorAll("table").length, 1, "after the first paint");
  ed.render(ed.doc.view());
  ed.render(ed.doc.view());
  eq(ed.contentEl.querySelectorAll("table").length, 1, "after three paints");
  return ed;
});

// ── reuse across frames ───────────────────────────────────────────────────

await test("an edit rebuilds the rows it touched and keeps the rest", () => {
  const ed = editor("first paragraph\n\nsecond paragraph\n\nthird paragraph\n");
  const rows = ed._lastView.rows;
  const first = ed.rowEls[0];
  const lastIdx = rows.length - 1;
  const last = ed.rowEls[lastIdx];
  const midIdx = rows.findIndex((r) => r.runs.some((x) => x.text.includes("second")));
  const mid = ed.rowEls[midIdx];
  place(firstText(mid), 6);
  ed._syncFromDom();
  input(ed, "insertText", "X");
  assert(ed.source().includes("secondX"), "the edit did not land");
  assert(ed.rowEls[0] === first, "the untouched first row was rebuilt");
  assert(ed.rowEls[lastIdx] === last, "the untouched last row was rebuilt");
  assert(ed.rowEls[midIdx] !== mid, "the edited row was not rebuilt");
  eq(ed.rowEls[midIdx].textContent, "secondX paragraph");
  // The reused row's runs still know where they come from, one byte on.
  const span = last.querySelector(".leaf-run");
  eq(ed.source().slice(span._src, span._src + 5), "third", "a reused run's offset went stale");
  return ed;
});

await test("moving the selection changes no row", () => {
  const ed = editor("one **two** three\n\nfour\n");
  const before = [...ed.rowEls];
  ed.selectAll();
  assert(ed._lastView.has_selection, "select-all did not select");
  ed.render(ed.doc.view());
  assert(before.every((el, i) => ed.rowEls[i] === el), "a selection split rebuilt a row");
  // And the selection is still one run to the DOM, not the halves core cut.
  eq(ed.rowEls[0].querySelectorAll(".leaf-run").length, 3, "runs: body, bold, body");
  return ed;
});

await test("a picture survives an edit above it", () => {
  const ed = editor("before\n\n![a leaf](leaf.svg)\n\nafter\n");
  const img = ed.contentEl.querySelector("img.leaf-media");
  assert(img, "no image was built");
  place(firstText(ed.rowEls[0]), 3);
  ed._syncFromDom();
  input(ed, "insertText", "Z");
  assert(ed.contentEl.querySelector("img.leaf-media") === img, "the image was rebuilt");
  return ed;
});

await test("a code block's edges follow the block as it shrinks", () => {
  const ed = editor("prose\n\n```\nalpha\nbeta\n```\n\nafter\n");
  const rows = ed._lastView.rows;
  const alphaIdx = rows.findIndex((r) => r.code && r.runs.some((x) => x.text === "alpha"));
  const betaIdx = rows.findIndex((r) => r.code && r.runs.some((x) => x.text === "beta"));
  assert(alphaIdx > 0 && betaIdx > alphaIdx, "the code rows were not found");
  const alpha = ed.rowEls[alphaIdx];
  assert(!alpha.classList.contains("code-last"), "alpha was already the last line");
  // Select from the end of alpha to the end of beta and delete: alpha becomes
  // the block's last line, so its bottom edge has to move onto it — a row
  // whose own text did not change, only what stands next to it.
  ed.render(ed.doc.set_selection(alphaIdx, 5, betaIdx, 4));
  input(ed, "deleteContentBackward");
  assert(/```\nalpha\n```/.test(ed.source()), `beta was not removed: ${ed.source()}`);
  const firsts = ed.contentEl.querySelectorAll(".code-first");
  const lasts = ed.contentEl.querySelectorAll(".code-last");
  eq(firsts.length, 1, "one first edge");
  eq(lasts.length, 1, "one last edge");
  assert(lasts[0].textContent === "alpha", "the last edge did not move up to alpha");
  return ed;
});

// ── the caret, in and out of a grid ───────────────────────────────────────

await test("a point in a cell maps to the source byte under it", () => {
  const ed = editor(TABLE_DOC);
  const line = ed.cellLines.find((l) => l.el.textContent.includes("leaf-web"));
  assert(line, "no cell line for the second body row");
  place(firstText(line.el), 4);
  assert(ed._syncFromDom(), "the selection did not map into core");
  const src = ed._lastView.caret_src;
  eq(ed.source().slice(src - 4, src), "leaf", "the caret is not after 'leaf'");
  return ed;
});

await test("typing in a cell edits that cell and leaves the caret in it", () => {
  const ed = editor(TABLE_DOC);
  const line = ed.cellLines.find((l) => l.el.textContent.includes("leaf-web"));
  place(firstText(line.el), 4);
  ed._syncFromDom();
  input(ed, "insertText", "X");

  assert(ed.source().includes("| leafX-web |"), "the edit did not land in the cell");
  const cells = [...ed.contentEl.querySelector("table.leaf-table").rows[2].cells];
  eq(cells.map((c) => c.textContent), ["leafX-web", "its own", "b"]);

  const sel = window.getSelection();
  assert(
    sel.focusNode?.parentElement?.closest(".leaf-cell-line"),
    "the caret was not restored inside the cell"
  );
  return ed;
});

await test("a caret placed by core round-trips back out of the DOM", () => {
  const ed = editor(TABLE_DOC);
  const line = ed.cellLines.find((l) => l.el.textContent.includes("picture"));
  place(firstText(line.el), 3);
  ed._syncFromDom();
  const src = ed._lastView.caret_src;
  // Repaint from the model, then read the browser's selection back: the two
  // descriptions of a table have to agree about where the caret is.
  ed.render(ed.doc.view());
  assert(ed._syncFromDom(), "the restored selection did not map back");
  eq(ed._lastView.caret_src, src, "the caret moved across a repaint");
  return ed;
});

await test("Tab in a grid walks the cells; outside it indents", () => {
  const ed = editor(TABLE_DOC);
  const line = ed.cellLines.find((l) => l.el.textContent.includes("leaf-tui"));
  place(firstText(line.el), 2);
  ed._syncFromDom();
  const before = ed._lastView.caret_src;
  ed.render(ed.doc.cell_tab(true) ?? ed.doc.indent());
  const after = ed._lastView.caret_src;
  assert(after !== before, "Tab did not move the caret out of the cell");
  assert(ed.doc.caret_in_table(), "Tab left the table entirely");
  // Outside a table there is no cell to step to, so core declines and the
  // ordinary meaning is what is left.
  const plain = editor("- an item\n");
  eq(plain.doc.cell_tab(true), undefined, "cell_tab answered outside a table");
  plain.destroy();
  return ed;
});

await test("typing in a cell far down the document keeps the viewport where it was", () => {
  let src = "";
  for (let i = 0; i < 80; i++) src += `paragraph ${i}\n\n`;
  const ed = editor(src + "| a | b |\n|---|---|\n| leaf-web | x |\n\nafter\n");
  const mount = document.getElementById("mount");
  const line = ed.cellLines.find((l) => l.el.textContent.includes("leaf-web"));
  place(firstText(line.el), 2);
  ed._syncFromDom();
  mount.scrollTop = mount.scrollHeight;
  const before = mount.scrollTop;
  assert(before > 0, "the mount did not scroll");
  input(ed, "insertText", "Z");
  assert(ed.source().includes("leZaf-web"), "the edit did not land");
  // The row core names for the caret is the picture row, which is not in the
  // document; scrolling to its (zero) offset sent the viewport to the top.
  assert(mount.scrollTop > before * 0.5, `the viewport jumped to ${mount.scrollTop} from ${before}`);
  return ed;
});

// ── media rows ────────────────────────────────────────────────────────────

await test("a media row has a caret stop on each side of the picture", () => {
  const ed = editor("before\n\n![a leaf](leaf.svg)\n\nafter\n");
  const media = (ed._lastView.media || [])[0];
  assert(media, "core reserved no media row");
  const rowEl = ed.rowEls[media.row];
  const zwsps = [...rowEl.childNodes].filter((n) => n.nodeType === 3);
  eq(zwsps.length, 2, "the caret homes either side of the element");

  // Core's two columns are the row's two ends, and each maps to a distinct
  // place in the DOM — the failure this replaced put both at the same one.
  const coreLen = Number(rowEl.dataset.mediaCoreLen);
  assert(coreLen > 0, "the row's core length was not recorded");
  const near = ed._domPoint(zwsps[0], 0);
  const far = ed._domPoint(zwsps[1], 1);
  eq(near.ch, 0, "the near stop");
  eq(far.ch, coreLen, "the far stop");
  assert(near.ch !== far.ch, "both stops collapsed onto one position");
  return ed;
});

// ── the wrap budget ───────────────────────────────────────────────────────

await test("ordinary prose does not overflow the measure", () => {
  // Capitals and inline code are what the average-glyph estimate gets wrong.
  const ed = editor(
    "THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG and `some_inline_code_here` " +
      "and more WORDS IN CAPITALS to push the line past the measure it was given.\n"
  );
  const avail = ed._availWidth();
  const widest = Math.max(
    ...ed.rowEls.filter((r) => r.isConnected).map((r) => r.scrollWidth)
  );
  assert(widest <= avail + 1, `a row is ${widest}px in a ${avail}px measure`);
  assert(!ed._acceptedOverflow, "the fit gave up on wrappable prose");
  return ed;
});

await test("one unwrappable word scrolls without narrowing the document", () => {
  const long = "W".repeat(120);
  const ed = editor(`some ordinary prose to set the measure by, and then ${long} after it.\n`);
  // It cannot be made to fit — but the budget must not be dragged down chasing
  // it, so the rest of the document keeps a measure close to the full width.
  const avail = ed._availWidth();
  const rows = ed.rowEls.filter((r) => r.isConnected && r.scrollWidth <= avail + 1);
  const widestFitting = Math.max(0, ...rows.map((r) => r.scrollWidth));
  assert(
    widestFitting > avail * 0.5,
    `the measure collapsed to ${widestFitting}px of ${avail}px`
  );
  return ed;
});

// ── clickable things ──────────────────────────────────────────────────────

await test("clicking a task box ticks it", () => {
  const ed = editor("- [ ] not yet\n- [x] already\n");
  const box = [...ed.contentEl.querySelectorAll(".leaf-r-list")].find((e) =>
    /^[☐☑]/.test(e.textContent)
  );
  assert(box, "no checkbox was drawn");
  box.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  assert(ed.source().startsWith("- [x] not yet"), `not ticked: ${ed.source()}`);
  return ed;
});

await test("a link follows only with the platform modifier held", () => {
  const ed = editor("see [the docs](https://example.com/x) now\n");
  let followed = null;
  ed.onFollowLink((d) => { followed = d; });
  const link = ed.contentEl.querySelector(".leaf-r-link");
  assert(link, "no link was drawn");

  link.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  eq(followed, null, "a plain click navigated away instead of placing a caret");

  link.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, metaKey: true }));
  eq(followed, "https://example.com/x", "the modified click did not follow");
  return ed;
});

// ── input intents ─────────────────────────────────────────────────────────

await test("an autocorrect replaces the word it names, not the caret", () => {
  const ed = editor("teh quick fox\n");
  const node = firstText(ed.rowEls[0]);
  // The caret sits after the word, as it does when autocorrect fires on the
  // space; the word itself is named only by the event's target range.
  place(node, 3);
  ed._syncFromDom();
  const range = new StaticRange({
    startContainer: node, startOffset: 0, endContainer: node, endOffset: 3,
  });
  ed.contentEl.dispatchEvent(
    new InputEvent("beforeinput", {
      inputType: "insertReplacementText", data: "the", targetRanges: [range],
      bubbles: true, cancelable: true,
    })
  );
  eq(ed.source(), "the quick fox\n", "the replaced word was left in place");
  return ed;
});

await test("delete-to-line-start takes the line, not a word", () => {
  const ed = editor("one two three\nnext\n");
  place(firstText(ed.rowEls[0]), 13);
  ed._syncFromDom();
  input(ed, "deleteSoftLineBackward");
  eq(ed.source(), "\nnext\n", "⌘⌫ did not clear back to the line start");
  return ed;
});

await test("shortcuts answer to the platform's modifier only", () => {
  const ed = editor("word\n");
  ed.selectAll();
  const key = (init) =>
    ed.contentEl.dispatchEvent(new KeyboardEvent("keydown", { key: "b", bubbles: true, cancelable: true, ...init }));
  const mac = /Mac/.test(navigator.platform);
  // The other platform's modifier is the system's own — on a Mac, Ctrl+B is
  // "caret left" — and must pass through untouched.
  key(mac ? { ctrlKey: true } : { metaKey: true });
  eq(ed.source(), "word\n", "the wrong modifier toggled bold");
  key(mac ? { metaKey: true } : { ctrlKey: true });
  eq(ed.source(), "**word**\n", "the platform modifier did not toggle bold");
  return ed;
});

// ── host highlights ───────────────────────────────────────────────────────

await test("a host highlight washes exactly its bytes and answers a click", () => {
  const ed = editor("the quick brown fox\n");
  let hit = null;
  ed.onActivateHighlight((id) => { hit = id; });
  ed.setHighlights([{ start: 4, end: 9, id: "h1", color: "#ff0000" }]);
  const washed = [...ed.contentEl.querySelectorAll(".leaf-hl")];
  eq(washed.map((e) => e.textContent), ["quick"], "the wash covers the wrong text");
  eq(washed[0].dataset.hl, "h1");
  eq(washed[0].style.getPropertyValue("--leaf-hl"), "#ff0000", "the colour hint was dropped");
  eq(ed.highlightAt(6), "h1");
  eq(ed.highlightAt(1), null);
  washed[0].dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  eq(hit, "h1", "the click did not name the highlight");
  // Replacing the set with nothing clears it.
  ed.setHighlights([]);
  eq(ed.contentEl.querySelectorAll(".leaf-hl").length, 0, "the wash outlived its highlight");
  return ed;
});

// ── what the host is told ─────────────────────────────────────────────────

await test("read-only refuses the edit and drops the editing chrome", () => {
  let state = null;
  const ed = editor("fixed\n", { onChange: (s) => { state = s; } });
  ed.setReadOnly(true);
  assert(ed.isReadOnly(), "the gate did not close");
  eq(state.readOnly, true, "the state did not say so");
  assert(!ed.contentEl.isContentEditable, "the surface is still editable");
  place(firstText(ed.rowEls[0]), 5);
  ed._syncFromDom();
  input(ed, "insertText", "!");
  eq(ed.source(), "fixed\n", "a read-only document took an edit");
  ed.setReadOnly(false);
  assert(ed.contentEl.isContentEditable, "the surface did not come back");
  input(ed, "insertText", "!");
  eq(ed.source(), "fixed!\n", "the reopened document refused the edit");
  return ed;
});

await test("the change state carries what the history buttons enable by", () => {
  let state = null;
  const ed = editor("start\n", { onChange: (s) => { state = s; } });
  eq([state.canUndo, state.canRedo], [false, false], "a fresh document has no history");
  place(firstText(ed.rowEls[0]), 5);
  ed._syncFromDom();
  input(ed, "insertText", "!");
  eq([state.canUndo, state.canRedo], [true, false], "after an edit");
  ed.undo();
  eq([state.canUndo, state.canRedo], [false, true], "after undoing it");
  return ed;
});

await test("the selection can be read as text and as a quote", () => {
  const ed = editor("alpha beta gamma\n");
  eq(ed.selectedText(), null, "nothing selected yet");
  ed.render(ed.doc.select_range(6, 10));
  eq(ed.selectedText(), "beta");
  const q = ed.selectionQuote(3);
  eq([q.exact, q.prefix, q.suffix, q.start, q.end], ["beta", "ha ", " ga", 6, 10]);
  return ed;
});

// ── navigation ────────────────────────────────────────────────────────────

await test("a locator lands on the block it names, and a fragment link follows it", () => {
  const ed = editor("# Intro\n\nbody text\n\n[up](#intro)\n");
  let followed = null;
  ed.onFollowLink((d) => { followed = d; });
  ed.render(ed.doc.move_doc_end(false));
  assert(ed._lastView.caret_src > 0, "the caret did not leave the top");
  const landing = ed.doc.locate("intro");
  assert(landing && landing.start === 0 && landing.end > 0, "the heading was not located");
  assert(ed.goTo("intro"), "the heading was not located");
  // The block starts at its marker; the caret lands on its first visible stop.
  const onHeading = (src) => src >= landing.start && src <= landing.end;
  assert(onHeading(ed._lastView.caret_src), `the caret landed at ${ed._lastView.caret_src}, off the heading`);
  assert(ed.rowEls[0].classList.contains("leaf-landed"), "the landing was not flashed");
  eq(ed.goTo("nowhere"), false, "an unknown locator claimed to land");

  ed.render(ed.doc.move_doc_end(false));
  const link = ed.contentEl.querySelector(".leaf-r-link");
  link.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, metaKey: true }));
  assert(onHeading(ed._lastView.caret_src), "the fragment link did not land in the document");
  eq(followed, null, "an in-document link was handed to the host");
  return ed;
});

await test("a footnote goes down to its note and back up to its reference", () => {
  const ed = editor("text[^1] more\n\n[^1]: the note\n");
  const sup = ed.contentEl.querySelector(".leaf-sup");
  assert(sup, "no footnote reference was drawn");
  const note = ed.footnoteAt(sup._src);
  assert(note && note.offset != null, "the reference does not know its note");
  sup.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, metaKey: true }));
  eq(ed._lastView.caret_src, note.offset, "the click did not land on the note");
  const def = ed.footnoteDefinitionAtCaret();
  assert(def && def.offset != null, "the note does not know its reference");
  assert(ed.followFootnote(), "there was nothing to follow back");
  eq(ed._lastView.caret_src, def.offset, "the return leg did not land on the reference");
  return ed;
});

await test("hovering a link shows where it goes", () => {
  const ed = editor("see [the docs](https://example.com/x) now\n");
  const link = ed.contentEl.querySelector(".leaf-r-link");
  eq(link.title, "", "the tooltip was set before anyone hovered");
  link.dispatchEvent(new MouseEvent("mouseover", { bubbles: true }));
  eq(link.title, "https://example.com/x");
  return ed;
});

await test("the shortcuts leaf-gpui binds reach the model", () => {
  const ed = editor("word\n");
  const mac = /mac/i.test(navigator.platform);
  const mod = mac ? { metaKey: true } : { ctrlKey: true };
  const key = (init) =>
    ed.contentEl.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, ...mod, ...init }));
  ed.selectAll();
  key({ key: "c", shiftKey: true });
  eq(ed.source(), "`word`\n", "⌘⇧C did not toggle code");
  key({ key: "c", shiftKey: true });
  key({ key: "¡", code: "Digit1", altKey: true });
  eq(ed.source(), "# word\n", "⌘⌥1 did not make a heading");
  key({ key: "º", code: "Digit0", altKey: true });
  eq(ed.source(), "word\n", "⌘⌥0 did not make a paragraph");
  key({ key: "*", code: "Digit8", shiftKey: true });
  eq(ed.source(), "- word\n", "⌘⇧8 did not make a list");
  key({ key: "*", code: "Digit8", shiftKey: true });
  eq(ed.source(), "word\n", "⌘⇧8 did not toggle the list off");
  return ed;
});

await test("⌘⇧V pastes the plain flavour, and only for that paste", () => {
  const ed = editor("\n");
  const mac = /mac/i.test(navigator.platform);
  const mod = mac ? { metaKey: true } : { ctrlKey: true };
  const paste = () => {
    const dt = new DataTransfer();
    dt.setData("text/html", "<b>rich</b>");
    dt.setData("text/plain", "plain");
    ed.contentEl.dispatchEvent(new ClipboardEvent("paste", { clipboardData: dt, bubbles: true, cancelable: true }));
  };
  ed.contentEl.dispatchEvent(new KeyboardEvent("keydown", { key: "v", shiftKey: true, bubbles: true, cancelable: true, ...mod }));
  paste();
  eq(ed.source(), "plain\n", "the plain flavour was not taken");
  paste();
  eq(ed.source(), "plain**rich**\n", "the next paste was still plain");
  return ed;
});

// ── drag and drop ─────────────────────────────────────────────────────────

/** A point just inside the start of a row's text, for a drop to land on. */
function pointIn(el) {
  const r = el.querySelector(".leaf-run").getBoundingClientRect();
  return { clientX: r.left + 2, clientY: r.top + r.height / 2 };
}
function drag(ed, type, dt, at = {}) {
  return ed.contentEl.dispatchEvent(new DragEvent(type, { dataTransfer: dt, bubbles: true, cancelable: true, ...at }));
}

await test("text dropped from outside lands under the pointer", () => {
  const ed = editor("alpha\n\nbeta\n");
  const dt = new DataTransfer();
  dt.setData("text/plain", "X");
  const beta = ed.rowEls.find((r) => r.textContent === "beta");
  drag(ed, "drop", dt, pointIn(beta));
  eq(ed.source(), "alpha\n\nXbeta\n", "the drop did not land at the point");
  return ed;
});

await test("a selection dragged within the surface moves, and copies with ⌥", () => {
  const ed = editor("alpha\n\nbeta\n");
  ed.render(ed.doc.select_range(0, 5));
  const dt = new DataTransfer();
  drag(ed, "dragstart", dt);
  eq(dt.getData("text/plain"), "alpha", "the drag did not carry the source");
  const beta = ed.rowEls.find((r) => r.textContent === "beta");
  drag(ed, "drop", dt, pointIn(beta));
  eq(ed.source(), "\n\nalphabeta\n", "the selection was not moved");

  const ed2 = editor("alpha\n\nbeta\n");
  ed2.render(ed2.doc.select_range(0, 5));
  const dt2 = new DataTransfer();
  drag(ed2, "dragstart", dt2);
  const beta2 = ed2.rowEls.find((r) => r.textContent === "beta");
  drag(ed2, "drop", dt2, { ...pointIn(beta2), altKey: true });
  eq(ed2.source(), "alpha\n\nalphabeta\n", "⌥ did not copy");
  ed.destroy();
  return ed2;
});

await test("dropped files go to the host with the offset under the pointer", () => {
  const ed = editor("alpha\n\nbeta\n");
  let got = null;
  ed.onDropFiles((files, at) => { got = { names: files.map((f) => f.name), at }; });
  const dt = new DataTransfer();
  dt.items.add(new File(["x"], "leaf.png", { type: "image/png" }));
  const beta = ed.rowEls.find((r) => r.textContent === "beta");
  drag(ed, "drop", dt, pointIn(beta));
  eq(got, { names: ["leaf.png"], at: 7 });
  eq(ed.source(), "alpha\n\nbeta\n", "a file drop edited the document");
  return ed;
});

// ── another document, same editor ─────────────────────────────────────────

await test("load swaps the document and keeps the reader's preferences", () => {
  let state = null;
  const ed = editor("# Old\n\ntext\n", { onChange: (s) => { state = s; } });
  place(firstText(ed.rowEls[0]), 3);
  ed._syncFromDom();
  input(ed, "insertText", "!");
  assert(ed.isDirty(), "the edit did not dirty the old document");
  ed.setReadOnly(true);
  ed.setMarkupMode("full");
  const oldRow = ed.rowEls[0];
  ed.load("plain new text\n\n| a | b |\n|---|---|\n| c | d |\n");
  eq(ed.source(), "plain new text\n\n| a | b |\n|---|---|\n| c | d |\n");
  assert(!ed.isDirty(), "a freshly loaded document is not dirty");
  eq([state.canUndo, state.canRedo], [false, false], "the old history came along");
  eq(state.readOnly, true, "read-only did not carry over");
  eq(ed.markupMode(), "full", "the markup mode did not carry over");
  assert(ed.rowEls[0] !== oldRow, "the old surface is still showing");
  assert(ed.contentEl.querySelector("table.leaf-table"), "the new document's grid was not drawn");
  eq(ed._lastView.caret_src, 0, "the caret did not start at the top");
  return ed;
});

await test("a repaint does not pull focus out of the host's own field", () => {
  const ed = editor("some text\n");
  const field = document.createElement("input");
  document.body.appendChild(field);
  try {
    field.focus();
    assert(document.activeElement === field, "the field did not take focus");
    ed.setHighlights([{ start: 0, end: 4, id: "h" }]);
    assert(document.activeElement === field, "the repaint stole focus from the field");
    // Back in the editor, the caret is restored as ever.
    ed.focus();
    ed.render(ed.doc.set_selection_offsets(5, 5));
    const sel = window.getSelection();
    assert(ed.contentEl.contains(sel.focusNode), "the caret was not restored once focused");
  } finally {
    field.remove();
  }
  return ed;
});

await test("autofocus can be declined", () => {
  const ed = editor("quiet\n", { autofocus: false });
  assert(document.activeElement !== ed.contentEl, "the editor took focus anyway");
  ed.focus();
  assert(document.activeElement === ed.contentEl, "focus() did not focus");
  return ed;
});

// ── what the format can spell ─────────────────────────────────────────────

await test("capabilities answer for the format, not for the editor", () => {
  const md = editor("hello\n");
  const caps = md.capabilities();
  eq(caps.bold, true, "markdown has bold");
  eq(caps.mark, false, "markdown has no highlight syntax");
  assert(md.isAuthorable(), "markdown is authorable");
  md.destroy();

  const dj = editor("hello\n", { format: "djot" });
  eq(dj.capabilities().mark, true, "djot does have a highlight");
  return dj;
});

// ── boundaries ────────────────────────────────────────────────────────────

await test("a block boundary is read from core, not sniffed off the row", () => {
  const ed = editor("a paragraph\n\n## a heading\n\nanother paragraph\n");
  const rows = ed._lastView.rows;
  const gaps = rows.filter((r) => r.boundary != null);
  assert(gaps.length >= 2, "core published no boundaries");
  assert(
    gaps.some((r) => r.boundary.below === "heading"),
    "no gap reported a heading below it"
  );
  // A boundary above a heading is drawn taller than one below it, so the
  // heading groups with the text it introduces.
  const above = rows.findIndex((r) => r.boundary?.below === "heading");
  const below = rows.findIndex((r) => r.boundary?.above === "heading");
  assert(above >= 0 && below >= 0, "expected a gap on each side of the heading");
  const h = (i) => ed.rowEls[i].getBoundingClientRect().height;
  assert(h(above) > h(below), `above=${h(above)}px is not taller than below=${h(below)}px`);
  return ed;
});

// ── the module's own helpers, through the surface that uses them ──────────

await test("a wide glyph keeps the caret in step across a cell", () => {
  // A cell holding astral and CJK text: source bytes, display columns and
  // UTF-16 units all disagree here, which is where the mapping earns its keep.
  const ed = editor("| a | b |\n|---|---|\n| 漢字🍃x | y |\n");
  const line = ed.cellLines.find((l) => l.el.textContent.includes("漢字"));
  assert(line, "the wide cell did not render");
  const node = firstText(line.el);
  // Core's offsets are UTF-8 *byte* offsets; the DOM counts UTF-16 units. Walk
  // every UTF-16 boundary in the cell and check each maps to a byte that really
  // does begin a character — a continuation byte (0b10xxxxxx) would mean the
  // mapping had landed inside one.
  const bytes = new TextEncoder().encode(ed.source());
  const seen = new Set();
  for (let i = 0; i <= node.length; i++) {
    place(node, i);
    if (!ed._syncFromDom()) continue;
    const src = ed._lastView.caret_src;
    seen.add(src);
    assert(src >= 0 && src <= bytes.length, `offset ${src} is outside the source`);
    assert(
      src === bytes.length || (bytes[src] & 0xc0) !== 0x80,
      `offset ${src} landed inside a character (from UTF-16 ${i})`
    );
  }
  // The cell has several distinct caret homes, so this is not vacuously true of
  // a mapping that answers with the same offset every time.
  assert(seen.size > 2, `only ${seen.size} distinct offsets across the cell`);
  return ed;
});
