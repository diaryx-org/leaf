<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>leaf-web · tests</title>
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 0; padding: 16px 20px;
    background: #14161b; color: #d7dce5; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #summary { padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; font-weight: 700; }
  #summary.pass { background: #1d3f34; color: #7fd1c1; }
  #summary.fail { background: #45222a; color: #ff9d9d; }
  li { list-style: none; }
  li.pass::before { content: "ok   "; color: #7fd1c1; }
  li.fail::before { content: "FAIL "; color: #ff8888; }
  li.fail { color: #ff9d9d; }
  .why { color: #8b93a3; padding-left: 5ch; }
  /* The editor mounts here. Given a real size, because the wrap-fitting tests
     measure it — a zero-width box would make every one of them vacuous. */
  #mount { width: 700px; height: 320px; margin-top: 16px; outline: 1px dashed #333; }
</style>
</head>
<body>
<h1>leaf-web · editor tests</h1>
<div id="summary">running…</div>
<!-- The mount sits above the results, not below them: the list grows a line
     per test, and a mount under it drifts down the page until — some forty
     tests in — its rows are below the headless window, where a test that
     drops or clicks at a point finds nothing there. -->
<div id="mount"></div>
<ul id="results"></ul>

<script type="module">
// Tests for the half of leaf-web that Rust cannot reach: the DOM projection and
// the input plumbing. They run in a real browser against the real wasm, because
// that is the only place a `TreeWalker`, a `Range`, a native selection, and a
// laid-out proportional font all behave the way the editor depends on. A stub
// DOM would mostly be testing the stub.
//
// Run with `cargo xtask web --test`, which serves this page and opens it. The
// page reports into `document.title` and `window.__results` as well as on
// screen, so an automated driver can read the outcome without scraping.
import {
  LeafEditor,
  MARK_COLORS,
  ALIGNMENTS,
  LINE_SPACINGS,
  SIZE_STEPS,
  FONT_FAMILIES,
  PRESENTATION_CSS,
} from "../src/index.js";

const results = [];
const list = document.getElementById("results");

function record(name, error) {
  results.push({ name, ok: !error, error: error ? String(error.message || error) : null });
  const li = document.createElement("li");
  li.className = error ? "fail" : "pass";
  li.textContent = name;
  list.appendChild(li);
  if (error) {
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = String(error.message || error);
    list.appendChild(why);
  }
}

async function test(name, fn) {
  let ed = null;
  try {
    ed = await fn();
    record(name, null);
  } catch (e) {
    record(name, e);
  } finally {
    try { ed?.destroy?.(); } catch { /* a test that failed mid-construction */ }
  }
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || "assertion failed");
}
function eq(actual, expected, msg) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((msg ? msg + ": " : "") + `expected ${b}, got ${a}`);
}

/** A fresh editor on the shared mount, so each test starts from a clean surface. */
function editor(source, opts = {}) {
  const mount = document.getElementById("mount");
  mount.innerHTML = "";
  return new LeafEditor(mount, { source, format: "markdown", ...opts });
}

/** Put the browser's selection at a DOM point, as a click would. */
function place(node, offset) {
  const r = document.createRange();
  r.setStart(node, offset);
  r.collapse(true);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

/** The first text node inside a run of `el`. */
function firstText(el) {
  const t = el.querySelector(".leaf-run");
  assert(t, "no run inside the element");
  return t.firstChild;
}

/** Dispatch a real editing intent, the way a keystroke does. */
function input(ed, inputType, data) {
  return ed.contentEl.dispatchEvent(
    new InputEvent("beforeinput", { inputType, data, bubbles: true, cancelable: true })
  );
}

const TABLE_DOC = [
  "# Grid",
  "",
  "| Frontend | Draws | Align |",
  "|---|---|:-:|",
  "| leaf-tui | picture | a |",
  "| leaf-web | its own | b |",
  "",
  "After the table.",
  "",
].join("\n");

await LeafEditor.init();

// ── the projection ────────────────────────────────────────────────────────

await test("a table renders as a grid, not as box glyphs", () => {
  const ed = editor(TABLE_DOC);
  const table = ed.contentEl.querySelector("table.leaf-table");
  assert(table, "no <table> was built");
  eq(table.rows.length, 3, "header plus two body rows");
  eq([...table.rows[0].cells].map((c) => c.tagName), ["TH", "TH", "TH"]);
  eq([...table.rows[1].cells].map((c) => c.textContent), ["leaf-tui", "picture", "a"]);
  assert(
    !/[┌│├└┬┴┼─]/.test(ed.contentEl.textContent),
    "the monospace picture is still being painted alongside the grid"
  );
  return ed;
});

await test("a column's alignment reaches the cell", () => {
  const ed = editor(TABLE_DOC);
  const head = ed.contentEl.querySelector("table.leaf-table").rows[0];
  eq([...head.cells].map((c) => c.style.textAlign || "-"), ["-", "-", "center"]);
  return ed;
});

await test("a repaint replaces the grid rather than stacking another under it", () => {
  const ed = editor(TABLE_DOC);
  eq(ed.contentEl.querySelectorAll("table").length, 1, "after the first paint");
  ed.render(ed.doc.view());
  ed.render(ed.doc.view());
  eq(ed.contentEl.querySelectorAll("table").length, 1, "after three paints");
  return ed;
});

// ── reuse across frames ───────────────────────────────────────────────────

await test("an edit rebuilds the rows it touched and keeps the rest", () => {
  const ed = editor("first paragraph\n\nsecond paragraph\n\nthird paragraph\n");
  const rows = ed._lastView.rows;
  const first = ed.rowEls[0];
  const lastIdx = rows.length - 1;
  const last = ed.rowEls[lastIdx];
  const midIdx = rows.findIndex((r) => r.runs.some((x) => x.text.includes("second")));
  const mid = ed.rowEls[midIdx];
  place(firstText(mid), 6);
  ed._syncFromDom();
  input(ed, "insertText", "X");
  assert(ed.source().includes("secondX"), "the edit did not land");
  assert(ed.rowEls[0] === first, "the untouched first row was rebuilt");
  assert(ed.rowEls[lastIdx] === last, "the untouched last row was rebuilt");
  assert(ed.rowEls[midIdx] !== mid, "the edited row was not rebuilt");
  eq(ed.rowEls[midIdx].textContent, "secondX paragraph");
  // The reused row's runs still know where they come from, one byte on.
  const span = last.querySelector(".leaf-run");
  eq(ed.source().slice(span._src, span._src + 5), "third", "a reused run's offset went stale");
  return ed;
});

await test("moving the selection changes no row", () => {
  const ed = editor("one **two** three\n\nfour\n");
  const before = [...ed.rowEls];
  ed.selectAll();
  assert(ed._lastView.has_selection, "select-all did not select");
  ed.render(ed.doc.view());
  assert(before.every((el, i) => ed.rowEls[i] === el), "a selection split rebuilt a row");
  // And the selection is still one run to the DOM, not the halves core cut.
  eq(ed.rowEls[0].querySelectorAll(".leaf-run").length, 3, "runs: body, bold, body");
  return ed;
});

await test("a picture survives an edit above it", () => {
  const ed = editor("before\n\n![a leaf](leaf.svg)\n\nafter\n");
  const img = ed.contentEl.querySelector("img.leaf-media");
  assert(img, "no image was built");
  place(firstText(ed.rowEls[0]), 3);
  ed._syncFromDom();
  input(ed, "insertText", "Z");
  assert(ed.contentEl.querySelector("img.leaf-media") === img, "the image was rebuilt");
  return ed;
});

await test("a code block's edges follow the block as it shrinks", () => {
  const ed = editor("prose\n\n```\nalpha\nbeta\n```\n\nafter\n");
  const rows = ed._lastView.rows;
  const alphaIdx = rows.findIndex((r) => r.code && r.runs.some((x) => x.text === "alpha"));
  const betaIdx = rows.findIndex((r) => r.code && r.runs.some((x) => x.text === "beta"));
  assert(alphaIdx > 0 && betaIdx > alphaIdx, "the code rows were not found");
  const alpha = ed.rowEls[alphaIdx];
  assert(!alpha.classList.contains("code-last"), "alpha was already the last line");
  // Select from the end of alpha to the end of beta and delete: alpha becomes
  // the block's last line, so its bottom edge has to move onto it — a row
  // whose own text did not change, only what stands next to it.
  ed.render(ed.doc.set_selection(alphaIdx, 5, betaIdx, 4));
  input(ed, "deleteContentBackward");
  assert(/```\nalpha\n```/.test(ed.source()), `beta was not removed: ${ed.source()}`);
  const firsts = ed.contentEl.querySelectorAll(".code-first");
  const lasts = ed.contentEl.querySelectorAll(".code-last");
  eq(firsts.length, 1, "one first edge");
  eq(lasts.length, 1, "one last edge");
  assert(lasts[0].textContent === "alpha", "the last edge did not move up to alpha");
  return ed;
});

await test("a code block's edges follow the block as it grows", () => {
  // The other direction, and the one that found a core bug: Return at the end
  // of the block's last line writes an empty line CommonMark keeps as content,
  // and core used to lay out no row for it — the caret landed on `after` and
  // the next keystroke went into the paragraph below. The block grows by a row
  // and its bottom edge moves down onto the empty one.
  const ed = editor("prose\n\n```\nalpha\nbeta\n```\n\nafter\n");
  const rows = ed._lastView.rows;
  const betaIdx = rows.findIndex((r) => r.code && r.runs.some((x) => x.text === "beta"));
  assert(betaIdx > 0, "the code rows were not found");
  const codeBefore = rows.filter((r) => r.code).length;

  ed.render(ed.doc.set_selection(betaIdx, 4, betaIdx, 4));
  input(ed, "insertParagraph");
  assert(/```\nalpha\nbeta\n\n```/.test(ed.source()), `no empty line was made: ${ed.source()}`);
  eq(ed._lastView.rows.filter((r) => r.code).length, codeBefore + 1, "the block did not grow");

  const lasts = ed.contentEl.querySelectorAll(".code-last");
  eq(ed.contentEl.querySelectorAll(".code-first").length, 1, "one first edge");
  eq(lasts.length, 1, "one last edge");
  eq(lasts[0].textContent, "", "the last edge did not move down onto the empty line");

  // And the caret is on that row, so what is typed next is code.
  input(ed, "insertText", "gamma");
  assert(
    /```\nalpha\nbeta\ngamma\n```/.test(ed.source()),
    `typing did not land in the block: ${ed.source()}`
  );
  return ed;
});

// ── the caret, in and out of a grid ───────────────────────────────────────

await test("a point in a cell maps to the source byte under it", () => {
  const ed = editor(TABLE_DOC);
  const line = ed.cellLines.find((l) => l.el.textContent.includes("leaf-web"));
  assert(line, "no cell line for the second body row");
  place(firstText(line.el), 4);
  assert(ed._syncFromDom(), "the selection did not map into core");
  const src = ed._lastView.caret_src;
  eq(ed.source().slice(src - 4, src), "leaf", "the caret is not after 'leaf'");
  return ed;
});

await test("typing in a cell edits that cell and leaves the caret in it", () => {
  const ed = editor(TABLE_DOC);
  const line = ed.cellLines.find((l) => l.el.textContent.includes("leaf-web"));
  place(firstText(line.el), 4);
  ed._syncFromDom();
  input(ed, "insertText", "X");

  assert(ed.source().includes("| leafX-web |"), "the edit did not land in the cell");
  const cells = [...ed.contentEl.querySelector("table.leaf-table").rows[2].cells];
  eq(cells.map((c) => c.textContent), ["leafX-web", "its own", "b"]);

  const sel = window.getSelection();
  assert(
    sel.focusNode?.parentElement?.closest(".leaf-cell-line"),
    "the caret was not restored inside the cell"
  );
  return ed;
});

await test("a caret placed by core round-trips back out of the DOM", () => {
  const ed = editor(TABLE_DOC);
  const line = ed.cellLines.find((l) => l.el.textContent.includes("picture"));
  place(firstText(line.el), 3);
  ed._syncFromDom();
  const src = ed._lastView.caret_src;
  // Repaint from the model, then read the browser's selection back: the two
  // descriptions of a table have to agree about where the caret is.
  ed.render(ed.doc.view());
  assert(ed._syncFromDom(), "the restored selection did not map back");
  eq(ed._lastView.caret_src, src, "the caret moved across a repaint");
  return ed;
});

await test("Tab in a grid walks the cells; outside it indents", () => {
  const ed = editor(TABLE_DOC);
  const line = ed.cellLines.find((l) => l.el.textContent.includes("leaf-tui"));
  place(firstText(line.el), 2);
  ed._syncFromDom();
  const before = ed._lastView.caret_src;
  ed.render(ed.doc.cell_tab(true) ?? ed.doc.indent());
  const after = ed._lastView.caret_src;
  assert(after !== before, "Tab did not move the caret out of the cell");
  assert(ed.doc.caret_in_table(), "Tab left the table entirely");
  // Outside a table there is no cell to step to, so core declines and the
  // ordinary meaning is what is left.
  const plain = editor("- an item\n");
  eq(plain.doc.cell_tab(true), undefined, "cell_tab answered outside a table");
  plain.destroy();
  return ed;
});

await test("typing in a cell far down the document keeps the viewport where it was", () => {
  let src = "";
  for (let i = 0; i < 80; i++) src += `paragraph ${i}\n\n`;
  const ed = editor(src + "| a | b |\n|---|---|\n| leaf-web | x |\n\nafter\n");
  const mount = document.getElementById("mount");
  const line = ed.cellLines.find((l) => l.el.textContent.includes("leaf-web"));
  place(firstText(line.el), 2);
  ed._syncFromDom();
  mount.scrollTop = mount.scrollHeight;
  const before = mount.scrollTop;
  assert(before > 0, "the mount did not scroll");
  input(ed, "insertText", "Z");
  assert(ed.source().includes("leZaf-web"), "the edit did not land");
  // The row core names for the caret is the picture row, which is not in the
  // document; scrolling to its (zero) offset sent the viewport to the top.
  assert(mount.scrollTop > before * 0.5, `the viewport jumped to ${mount.scrollTop} from ${before}`);
  return ed;
});

// ── media rows ────────────────────────────────────────────────────────────

await test("a media row has a caret stop on each side of the picture", () => {
  const ed = editor("before\n\n![a leaf](leaf.svg)\n\nafter\n");
  const media = (ed._lastView.media || [])[0];
  assert(media, "core reserved no media row");
  const rowEl = ed.rowEls[media.row];
  const zwsps = [...rowEl.childNodes].filter((n) => n.nodeType === 3);
  eq(zwsps.length, 2, "the caret homes either side of the element");

  // Core's two columns are the row's two ends, and each maps to a distinct
  // place in the DOM — the failure this replaced put both at the same one.
  const coreLen = Number(rowEl.dataset.leafCoreLen);
  assert(coreLen > 0, "the row's core length was not recorded");
  const near = ed._domPoint(zwsps[0], 0);
  const far = ed._domPoint(zwsps[1], 1);
  eq(near.ch, 0, "the near stop");
  eq(far.ch, coreLen, "the far stop");
  assert(near.ch !== far.ch, "both stops collapsed onto one position");
  return ed;
});

// ── the wrap budget ───────────────────────────────────────────────────────

await test("ordinary prose does not overflow the measure", () => {
  // Capitals and inline code are what the average-glyph estimate gets wrong.
  const ed = editor(
    "THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG and `some_inline_code_here` " +
      "and more WORDS IN CAPITALS to push the line past the measure it was given.\n"
  );
  const avail = ed._availWidth();
  const widest = Math.max(
    ...ed.rowEls.filter((r) => r.isConnected).map((r) => r.scrollWidth)
  );
  assert(widest <= avail + 1, `a row is ${widest}px in a ${avail}px measure`);
  assert(!ed._acceptedOverflow, "the fit gave up on wrappable prose");
  return ed;
});

await test("one unwrappable word scrolls without narrowing the document", () => {
  const long = "W".repeat(120);
  const ed = editor(`some ordinary prose to set the measure by, and then ${long} after it.\n`);
  // It cannot be made to fit — but the budget must not be dragged down chasing
  // it, so the rest of the document keeps a measure close to the full width.
  const avail = ed._availWidth();
  const rows = ed.rowEls.filter((r) => r.isConnected && r.scrollWidth <= avail + 1);
  const widestFitting = Math.max(0, ...rows.map((r) => r.scrollWidth));
  assert(
    widestFitting > avail * 0.5,
    `the measure collapsed to ${widestFitting}px of ${avail}px`
  );
  return ed;
});

// ── clickable things ──────────────────────────────────────────────────────

await test("clicking a task box ticks it", () => {
  const ed = editor("- [ ] not yet\n- [x] already\n");
  const box = [...ed.contentEl.querySelectorAll(".leaf-r-list")].find((e) =>
    /^[☐☑]/.test(e.textContent)
  );
  assert(box, "no checkbox was drawn");
  box.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  assert(ed.source().startsWith("- [x] not yet"), `not ticked: ${ed.source()}`);
  return ed;
});

await test("a link follows only with the platform modifier held", () => {
  const ed = editor("see [the docs](https://example.com/x) now\n");
  let followed = null;
  ed.onFollowLink((d) => { followed = d; });
  const link = ed.contentEl.querySelector(".leaf-r-link");
  assert(link, "no link was drawn");

  link.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  eq(followed, null, "a plain click navigated away instead of placing a caret");

  link.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, metaKey: true }));
  eq(followed, "https://example.com/x", "the modified click did not follow");
  return ed;
});

// ── input intents ─────────────────────────────────────────────────────────

await test("an autocorrect replaces the word it names, not the caret", () => {
  const ed = editor("teh quick fox\n");
  const node = firstText(ed.rowEls[0]);
  // The caret sits after the word, as it does when autocorrect fires on the
  // space; the word itself is named only by the event's target range.
  place(node, 3);
  ed._syncFromDom();
  const range = new StaticRange({
    startContainer: node, startOffset: 0, endContainer: node, endOffset: 3,
  });
  ed.contentEl.dispatchEvent(
    new InputEvent("beforeinput", {
      inputType: "insertReplacementText", data: "the", targetRanges: [range],
      bubbles: true, cancelable: true,
    })
  );
  eq(ed.source(), "the quick fox\n", "the replaced word was left in place");
  return ed;
});

await test("delete-to-line-start takes the line, not a word", () => {
  const ed = editor("one two three\nnext\n");
  place(firstText(ed.rowEls[0]), 13);
  ed._syncFromDom();
  input(ed, "deleteSoftLineBackward");
  eq(ed.source(), "\nnext\n", "⌘⌫ did not clear back to the line start");
  return ed;
});

await test("shortcuts answer to the platform's modifier only", () => {
  const ed = editor("word\n");
  ed.selectAll();
  const key = (init) =>
    ed.contentEl.dispatchEvent(new KeyboardEvent("keydown", { key: "b", bubbles: true, cancelable: true, ...init }));
  const mac = /Mac/.test(navigator.platform);
  // The other platform's modifier is the system's own — on a Mac, Ctrl+B is
  // "caret left" — and must pass through untouched.
  key(mac ? { ctrlKey: true } : { metaKey: true });
  eq(ed.source(), "word\n", "the wrong modifier toggled bold");
  key(mac ? { metaKey: true } : { ctrlKey: true });
  eq(ed.source(), "**word**\n", "the platform modifier did not toggle bold");
  return ed;
});

// ── host highlights ───────────────────────────────────────────────────────

await test("a host highlight washes exactly its bytes and answers a click", () => {
  const ed = editor("the quick brown fox\n");
  let hit = null;
  ed.onActivateHighlight((id) => { hit = id; });
  ed.setHighlights([{ start: 4, end: 9, id: "h1", color: "#ff0000" }]);
  const washed = [...ed.contentEl.querySelectorAll(".leaf-hl")];
  eq(washed.map((e) => e.textContent), ["quick"], "the wash covers the wrong text");
  eq(washed[0].dataset.hl, "h1");
  eq(washed[0].style.getPropertyValue("--leaf-hl"), "#ff0000", "the colour hint was dropped");
  eq(ed.highlightAt(6), "h1");
  eq(ed.highlightAt(1), null);
  washed[0].dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  eq(hit, "h1", "the click did not name the highlight");
  // Replacing the set with nothing clears it.
  ed.setHighlights([]);
  eq(ed.contentEl.querySelectorAll(".leaf-hl").length, 0, "the wash outlived its highlight");
  return ed;
});

// ── author highlights ─────────────────────────────────────────────────────

await test("a coloured highlight keeps the mark class and swaps only the wash", () => {
  const ed = editor("a ==\u{1F534} red== and ==plain== b\n");
  const marks = [...ed.contentEl.querySelectorAll(".leaf-r-mark")];
  eq(marks.map((e) => e.textContent), ["red", "plain"],
     "the emoji that named the colour was drawn as text");
  assert(marks[0].classList.contains("leaf-mk-red"), "the red wash was not asked for");
  assert(!marks[1].classList.contains("leaf-mk-red"), "a plain highlight took a colour");
  // Both are still `leaf-r-mark`, which is what makes the colour additive: a
  // stylesheet that knows nothing of `leaf-mk-*` still draws the highlight.
  assert(marks.every((e) => e.classList.contains("leaf-r-mark")), "the mark role was lost");
  return ed;
});

// ── syntax highlighting ───────────────────────────────────────────────────

await test("a fenced block in a known language is classed by token", () => {
  const ed = editor("```rust\nlet x = \"s\"; // c\n```\n\n```text\nlet y\n```\n");
  const rows = [...ed.contentEl.querySelectorAll(".leaf-row.code")];
  eq(rows.length, 2, "two code rows");
  const keyword = rows[0].querySelector(".leaf-t-keyword");
  assert(keyword && keyword.textContent === "let", "`let` is a keyword");
  const string = rows[0].querySelector(".leaf-t-string");
  assert(string && string.textContent === '"s"', "the literal, quotes included, is a string");
  const comment = rows[0].querySelector(".leaf-t-comment");
  assert(comment && getComputedStyle(comment).fontStyle === "italic", "a comment is italic");
  assert(
    getComputedStyle(keyword).color !== getComputedStyle(string).color,
    "a keyword and a string draw in different inks"
  );
  // Every run is still `leaf-r-code`: the token is additive, and a stylesheet
  // that knows nothing of `leaf-t-*` still draws the block as code.
  assert([...rows[0].querySelectorAll(".leaf-run")].every((e) => e.classList.contains("leaf-r-code")),
         "the code role was lost");
  // A language no grammar covers is one plain run, as it always was.
  eq([...rows[1].querySelectorAll("[class*=leaf-t-]")].length, 0, "`text` was highlighted");
  return ed;
});

// ── what the host is told ─────────────────────────────────────────────────

await test("read-only refuses the edit and drops the editing chrome", () => {
  let state = null;
  const ed = editor("fixed\n", { onChange: (s) => { state = s; } });
  ed.setReadOnly(true);
  assert(ed.isReadOnly(), "the gate did not close");
  eq(state.readOnly, true, "the state did not say so");
  assert(!ed.contentEl.isContentEditable, "the surface is still editable");
  place(firstText(ed.rowEls[0]), 5);
  ed._syncFromDom();
  input(ed, "insertText", "!");
  eq(ed.source(), "fixed\n", "a read-only document took an edit");
  ed.setReadOnly(false);
  assert(ed.contentEl.isContentEditable, "the surface did not come back");
  input(ed, "insertText", "!");
  eq(ed.source(), "fixed!\n", "the reopened document refused the edit");

/** A point just inside the start of a row's text, for a drop to land on. */
function pointIn(el) {
  const r = el.querySelector(".leaf-run").getBoundingClientRect();
  return { clientX: r.left + 2, clientY: r.top + r.height / 2 };
}
function drag(ed, type, dt, at = {}) {
  return ed.contentEl.dispatchEvent(new DragEvent(type, { dataTransfer: dt, bubbles: true, cancelable: true, ...at }));
}

  drag(ed, "drop", dt, pointIn(beta));
  eq(ed.source(), "alpha\n\nXbeta\n", "the drop did not land at the point");

});

// ── boundaries ────────────────────────────────────────────────────────────

await test("a block boundary is read from core, not sniffed off the row", () => {
  const ed = editor("a paragraph\n\n## a heading\n\nanother paragraph\n");
  const rows = ed._lastView.rows;
  const gaps = rows.filter((r) => r.boundary != null);
  assert(gaps.length >= 2, "core published no boundaries");
  assert(
    gaps.some((r) => r.boundary.below === "heading"),
    "no gap reported a heading below it"
  );
  // A boundary above a heading is drawn taller than one below it, so the
  // heading groups with the text it introduces.
  const above = rows.findIndex((r) => r.boundary?.below === "heading");
  const below = rows.findIndex((r) => r.boundary?.above === "heading");
  assert(above >= 0 && below >= 0, "expected a gap on each side of the heading");
  const h = (i) => ed.rowEls[i].getBoundingClientRect().height;
  assert(h(above) > h(below), `above=${h(above)}px is not taller than below=${h(below)}px`);
  return ed;
});

// ── the module's own helpers, through the surface that uses them ──────────

await test("a wide glyph keeps the caret in step across a cell", () => {
  // A cell holding astral and CJK text: source bytes, display columns and
  // UTF-16 units all disagree here, which is where the mapping earns its keep.
  const ed = editor("| a | b |\n|---|---|\n| 漢字🍃x | y |\n");
  const line = ed.cellLines.find((l) => l.el.textContent.includes("漢字"));
  assert(line, "the wide cell did not render");
  const node = firstText(line.el);
  // Core's offsets are UTF-8 *byte* offsets; the DOM counts UTF-16 units. Walk
  // every UTF-16 boundary in the cell and check each maps to a byte that really
  // does begin a character — a continuation byte (0b10xxxxxx) would mean the
  // mapping had landed inside one.
  const bytes = new TextEncoder().encode(ed.source());
  const seen = new Set();
  for (let i = 0; i <= node.length; i++) {
    place(node, i);
    if (!ed._syncFromDom()) continue;
    const src = ed._lastView.caret_src;
    seen.add(src);
    assert(src >= 0 && src <= bytes.length, `offset ${src} is outside the source`);
    assert(
      src === bytes.length || (bytes[src] & 0xc0) !== 0x80,
      `offset ${src} landed inside a character (from UTF-16 ${i})`
    );
  }
  // The cell has several distinct caret homes, so this is not vacuously true of
  // a mapping that answers with the same offset every time.
  assert(seen.size > 2, `only ${seen.size} distinct offsets across the cell`);
  return ed;
});

// ── the presentation vocabulary ───────────────────────────────────────────

await test("a centred block carries the class, and spacing scales the line box", () => {
  const ed = editor('<div class="center" data-line-height="1.5">\n\nhello\n\n</div>\n');
  const row = ed.rowEls.find((r) => r.textContent.includes("hello"));
  assert(row, "the block did not render");
  assert(row.classList.contains("center"), `the row's classes are ${row.className}`);
  eq(row.dataset.lineHeight, "1.5", "the spacing token rides the row");
  eq(getComputedStyle(row).textAlign, "center", "the stylesheet did not reach the row");
  // A multiple of the *theme's* line height (24px), not of the font size —
  // which is the difference between the editor's rule and the published page's
  // unitless one, and the reason the row's line box is computed in JS.
  eq(row.style.lineHeight, "36px", "the line box is not 1.5 of the theme's");
  return ed;
});

/**
 * Put the caret inside a word, as a click would. Each block gesture rewrites
 * the source around the caret — in Markdown by wrapping the block in a
 * `<div>` — so a test that presses two of them in a row says where the second
 * one is aimed rather than inheriting wherever the first left the caret.
 */
function caretAt(ed, word) {
  ed.reveal(ed.source().indexOf(word) + 1);
}

await test("the alignment gesture writes the class and the query reads it back", () => {
  const ed = editor("hello\n");
  eq(ed.alignmentAtCaret(), null, "a plain paragraph is the theme's default, which is left");
  ed.setAlignment("center");
  eq(ed.alignmentAtCaret(), "center");
  const row = ed.rowEls.find((r) => r.textContent.includes("hello"));
  assert(row.classList.contains("center"), `the row's classes are ${row.className}`);
  // Clearing is the same gesture with null — there is no `left` token.
  caretAt(ed, "hello");
  ed.setAlignment(null);
  eq(ed.alignmentAtCaret(), null);
  const cleared = ed.rowEls.find((r) => r.textContent.includes("hello"));
  assert(!cleared.classList.contains("center"), "the class outlived the key");
  assert(!ed.source().includes("<div"), `an empty set unwraps the div: ${JSON.stringify(ed.source())}`);
  return ed;
});

await test("a large run carries data-size, and the face and colour beside it", () => {
  const ed = editor('a <span data-size="large" data-font="serif" data-color="red">big</span> b\n');
  const runs = [...ed.contentEl.querySelectorAll(".leaf-run")];
  const run = runs.find((r) => r.dataset.size);
  assert(run, "no run carried a size");
  eq(run.textContent, "big", "the attributed span is not the run it wraps");
  eq(run.dataset.size, "large");
  eq(run.dataset.font, "serif");
  eq(run.dataset.color, "red");
  // A *step* larger than the text around it (16px × 1.125), not the absolute
  // keyword — so the same run inside a heading would step up from the
  // heading's size rather than down to the body's.
  eq(getComputedStyle(run).fontSize, "18px", "the size step is not relative to the text around it");
  const plain = runs.find((r) => !r.dataset.color && r.textContent.trim());
  assert(
    getComputedStyle(run).color !== getComputedStyle(plain).color,
    "the colour token did not reach the run"
  );
  assert(/serif/i.test(getComputedStyle(run).fontFamily), "the face token did not reach the run");
  // A name is a rule the stylesheet has. Drawing it inline as well would put
  // the theme's own ramp out of reach of a page that restyles the token.
  assert(
    !run.style.fontSize && !run.style.fontFamily && !run.style.color,
    `a name was drawn as an inline style: ${run.getAttribute("style")}`
  );
  return ed;
});

await test("an exact value draws inline, beside the token the document carries", () => {
  const ed = editor(
    '<div data-line-height="1.3">\n\n' +
      'a <span data-size="14pt" data-font="Garamond" data-color="#c03030">exact</span> b\n\n' +
      "</div>\n"
  );
  const run = [...ed.contentEl.querySelectorAll(".leaf-run")].find((r) => r.dataset.size);
  assert(run, "no run carried a size");
  eq(run.textContent, "exact", "the attributed span is not the run it wraps");
  // The document's own tokens still ride the element — a published page and
  // the editor's DOM are spelled the same, whichever form the author used.
  eq(run.dataset.size, "14pt");
  eq(run.dataset.font, "Garamond");
  eq(run.dataset.color, "#c03030");
  // And the value, which no stylesheet can enumerate, is transcribed inline.
  eq(run.style.fontSize, "14pt", "the point size was not set inline");
  assert(/Garamond/.test(run.style.fontFamily), `the family is ${run.style.fontFamily}`);
  eq(getComputedStyle(run).color, "rgb(192, 48, 48)", "the triple is painted as written");
  // 14 points is 14/72 of an inch, which CSS counts as 96 dots — the size the
  // author asked for, not the theme's.
  const px = parseFloat(getComputedStyle(run).fontSize);
  assert(Math.abs(px - (14 * 96) / 72) < 0.1, `14pt drew at ${px}px`);
  // The row's ratio goes through the same arithmetic the three names do: a
  // multiple of the theme's 24px line height, computed here because only this
  // editor knows what that is.
  const row = ed.rowEls.find((r) => r.textContent.includes("exact"));
  eq(row.dataset.lineHeight, "1.3", "the ratio rides the row");
  const leading = parseFloat(row.style.lineHeight);
  assert(Math.abs(leading - 24 * 1.3) < 0.01, `the line box is ${leading}px, not 1.3 of 24px`);
  return ed;
});

await test("an exact size replaces a heading's ramp rather than scaling it", () => {
  const ed = editor('# head <span data-size="14pt">exact</span>\n');
  const runs = [...ed.contentEl.querySelectorAll(".leaf-run")];
  const run = runs.find((r) => r.dataset.size);
  const plain = runs.find((r) => !r.dataset.size && r.textContent.includes("head"));
  assert(run && plain, "the heading did not render with both runs");
  // The heading's own size is the row's (16px × 1.625); the run's is 14pt,
  // which is smaller — the name scales the ramp, the value replaces it.
  eq(parseFloat(getComputedStyle(plain).fontSize), 26, "the heading is not at its ramp");
  const px = parseFloat(getComputedStyle(run).fontSize);
  assert(Math.abs(px - (14 * 96) / 72) < 0.1, `an exact size inside a heading drew at ${px}px`);
  return ed;
});

await test("a page break draws a rule, and the caret steps over it in one press", () => {
  const ed = editor("before\n\n::page-break\n\nafter\n");
  const breakRow = ed.rowEls.find((r) => r.classList.contains("leaf-page-break"));
  assert(breakRow, "no page-break row was drawn");
  assert(breakRow.querySelector(".leaf-page-break-rule"), "the row has no rule in it");
  assert(
    !ed.contentEl.textContent.includes("page-break"),
    "the placeholder glyphs are still being painted alongside the rule"
  );
  const before = ed.rowEls.find((r) => r.textContent === "before");
  const after = ed.rowEls.find((r) => r.textContent === "after");
  assert(before && after, "the paragraphs either side did not render");
  // The browser's own vertical motion, which is what an arrow key runs. The
  // break holds no caret, so one press clears it — two would mean the rule had
  // become a line the author has to walk through.
  const sel = window.getSelection();
  place(firstText(before), 0);
  sel.modify("move", "forward", "line");
  assert(
    after.contains(sel.anchorNode),
    "one step down did not clear the break"
  );
  place(firstText(after), 0);
  sel.modify("move", "backward", "line");
  assert(
    before.contains(sel.anchorNode),
    "one step up did not clear the break"
  );
  return ed;
});

await test("the page-break gesture writes a directive the renderer knows", () => {
  const ed = editor("hello world\n");
  assert(ed.capabilities().page_break, "markdown spells a page break");
  ed.insertPageBreak();
  assert(ed.source().includes("::page-break"), `wrote ${JSON.stringify(ed.source())}`);
  assert(
    ed.rowEls.some((r) => r.classList.contains("leaf-page-break")),
    "the directive did not arrive as a drawn break"
  );
  return ed;
});

await test("every presentation token the package offers is one core writes", () => {
  const ed = editor("hello\n");
  for (const [tokens, set, read] of [
    [ALIGNMENTS, "setAlignment", "alignmentAtCaret"],
    [LINE_SPACINGS, "setLineSpacing", "lineSpacingAtCaret"],
    [SIZE_STEPS, "setFontSize", "fontSizeAtCaret"],
    [FONT_FAMILIES, "setFontFamily", "fontFamilyAtCaret"],
    [MARK_COLORS, "setTextColor", "textColorAtCaret"],
  ]) {
    for (const token of tokens) {
      caretAt(ed, "hello");
      ed[set](token);
      eq(ed[read](), token, `${set}(${token})`);
    }
    caretAt(ed, "hello");
    ed[set](null);
    eq(ed[read](), null, `${set}(null) clears`);
  }
  // A name outside the vocabulary is an error, not the null that clears — the
  // two are one keystroke apart and mean opposite things.
  let threw = false;
  try { ed.setFontSize("huge"); } catch { threw = true; }
  assert(threw, "an unknown size was read as no size");
  return ed;
});

await test("the exact forms go through the API and come back as written", () => {
  const ed = editor("hello\n");
  // Each gesture edits one key and keeps the rest, so the four compose on the
  // same word — and each query answers the value the document now carries.
  for (const [set, read, value] of [
    ["setFontSize", "fontSizeAtCaret", "14pt"],
    ["setFontFamily", "fontFamilyAtCaret", "Garamond"],
    ["setTextColor", "textColorAtCaret", "#c03030"],
    ["setLineSpacing", "lineSpacingAtCaret", "1.3"],
  ]) {
    caretAt(ed, "hello");
    ed[set](value);
    eq(ed[read](), value, `${set}(${value})`);
  }
  // The run the four wrote is the run the renderer drew from.
  const run = [...ed.contentEl.querySelectorAll(".leaf-run")].find((r) => r.dataset.size);
  assert(run, `no run carried the size: ${JSON.stringify(ed.source())}`);
  eq(run.style.fontSize, "14pt", "the gesture's value did not reach the surface");
  // Only `pt` is a size unit — a screen's unit is not a document's, and a
  // refusal is not the null that clears.
  let threw = false;
  try { ed.setFontSize("14px"); } catch { threw = true; }
  assert(threw, "a px size was accepted");
  return ed;
});

await test("an inline formula is a picture the caret sits either side of", () => {
  const ed = editor("intro\n\nsay $E = mc^2$ here\n");
  const row = ed.rowEls.find((r) => r.textContent.includes("say"));
  assert(row, "the paragraph did not render");
  const atom = row.querySelector(".leaf-r-math");
  assert(atom, "no math run");
  assert(atom.classList.contains("leaf-math"), "the run was not drawn as a picture");
  eq(atom.textContent, "∑", "the atom character is not what core drew");
  assert(atom.style.backgroundImage.startsWith('url("data:image/svg+xml'), "no picture");
  const w = parseFloat(atom.style.width);
  assert(w > 30, `the picture is ${w}px wide`);
  // Stretched to the picture: the caret's two homes are its two edges.
  const rect = atom.getBoundingClientRect();
  place(atom.firstChild, 0);
  const r0 = window.getSelection().getRangeAt(0).getBoundingClientRect();
  place(atom.firstChild, 1);
  const r1 = window.getSelection().getRangeAt(0).getBoundingClientRect();
  assert(Math.abs(r0.left - rect.left) < 2, `caret before at ${r0.left}, picture at ${rect.left}`);
  assert(Math.abs(r1.left - rect.right) < 2, `caret after at ${r1.left}, picture ends at ${rect.right}`);
  // Both map into core at the formula's ends: past the closing `$`, and at
  // its start. Landing on either puts the caret on the formula's line, which
  // reveals it in the model — so the picture is put back between the two by
  // moving away and repainting, as the selectionchange handler would.
  place(atom.firstChild, 1);
  ed._syncFromDom();
  const end = ed._lastView.caret_src;
  eq(ed.source().slice(end - 2, end), "2$");
  place(firstText(ed.rowEls[0]), 0);
  ed._syncFromDom();
  ed.render(ed.doc.view());
  const again = ed.rowEls.find((r) => r.textContent.includes("say")).querySelector(".leaf-r-math");
  assert(again.classList.contains("leaf-math"), "the picture did not come back");
  place(again.firstChild, 0);
  ed._syncFromDom();
  const start = ed._lastView.caret_src;
  eq(ed.source().slice(start, start + 2), "$E");
  eq(end, start + "$E = mc^2$".length);
  return ed;
});

await test("a formula on the caret's line is its TeX, and folds back when the caret leaves", () => {
  const ed = editor("say $x+y$ here\n\nnext\n");
  // The caret opens on the first line: the formula is source, in code style.
  let row = ed.rowEls[0];
  assert(!row.querySelector(".leaf-r-math"), "a picture stood in under the caret");
  eq(row.textContent, "say $x+y$ here");
  assert(row.querySelector(".leaf-r-delimiter"), "the dollars are not delimiters");
  // Down to the next paragraph, and it is the picture.
  const next = ed.rowEls.find((r) => r.textContent === "next");
  place(firstText(next), 0);
  ed._syncFromDom();
  ed.render(ed.doc.view());
  row = ed.rowEls[0];
  assert(row.querySelector(".leaf-r-math.leaf-math"), "the formula did not fold to its picture");
  eq(row.textContent, "say ∑ here");
  return ed;
});

await test("a caret move onto a formula's line repaints, through the real selection", async () => {
  const ed = editor("say $x+y$ here\n\nnext\n");
  const next = ed.rowEls.find((r) => r.textContent === "next");
  place(firstText(next), 0);
  ed._syncFromDom();
  ed.render(ed.doc.view());
  eq(ed.rowEls[0].textContent, "say ∑ here", "the picture did not stand in");
  const key = ed._lastView.map_key;
  // A native selection change, as a click or an arrow key makes: the handler
  // sees the map's key move and paints the revealed line.
  place(ed.rowEls[0].querySelector(".leaf-r-math").firstChild, 0);
  await new Promise((r) => setTimeout(r, 0));
  assert(ed._lastView.map_key !== key, "the map did not change under the caret");
  eq(ed.rowEls[0].textContent, "say $x+y$ here", "the line was not repainted revealed");
  // And back off it, the picture again — one repaint each way, none between.
  place(firstText(ed.rowEls.find((r) => r.textContent === "next")), 0);
  await new Promise((r) => setTimeout(r, 0));
  eq(ed.rowEls[0].textContent, "say ∑ here", "the line did not fold back");
  return ed;
});

await test("a display formula is a centred picture in a row of its own", () => {
  const ed = editor("intro\n\n$$\n\\int_0^1 x\\,dx\n$$\n\nend\n");
  const row = ed.rowEls.find((r) => r.classList.contains("leaf-math-row"));
  assert(row, "no math row was drawn");
  const img = row.querySelector("img.leaf-math-block");
  assert(img && img.src.startsWith("data:image/svg+xml"), "no picture in the row");
  assert(!ed.contentEl.textContent.includes("\\int"), "the placeholder label is still painted");
  assert(row.classList.contains("leaf-media-row"), "the row is not the media row's shape");
  // Its two caret homes, as a picture's.
  place(row.firstChild, 0);
  ed._syncFromDom();
  const before = ed._lastView.caret_src;
  eq(ed.source().slice(before, before + 2), "$$");
  place(row.lastChild, 1);
  ed._syncFromDom();
  const after = ed._lastView.caret_src;
  eq(ed.source().slice(after - 2, after), "$$");
  assert(after > before);
  return ed;
});

await test("TeX that will not typeset keeps its atom, tinted, with the fault in its title", () => {
  const ed = editor("intro\n\nbad $\\frac{$ here\n\n$$\n\\frac{\n$$\n\nend\n");
  const atom = ed.contentEl.querySelector(".leaf-r-math");
  assert(atom, "no math run");
  assert(atom.classList.contains("leaf-math-error"), "the fault is not marked");
  assert(atom.title.length > 0, "no message");
  eq(atom.textContent, "∑");
  // The block stays core's placeholder row, as text.
  assert(!ed.rowEls.some((r) => r.classList.contains("leaf-math-row")), "a broken block was drawn as a picture");
  assert(ed.contentEl.textContent.includes("∑ \\frac{"), "the placeholder row is gone");
  return ed;
});

await test("the injected rules and presentation.css are the same stylesheet", async () => {
  const text = await (await fetch("../src/presentation.css")).text();
  // Comments and whitespace are each file's own; the rules are not.
  const rules = (css) => css.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\s+/g, " ").trim();
  eq(rules(text), rules(PRESENTATION_CSS), "presentation.css has drifted from PRESENTATION_CSS");
  assert(rules(text).length > 0, "presentation.css is empty");
});
