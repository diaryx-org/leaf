name: Mac app
# Ship Leaf, the Mac document app in apps/leaf-editor, as a Developer ID–signed,
# notarised and stapled .dmg attached to the tag's GitHub Release. The work is
# `cargo xtask package`'s — this workflow only gives it a keychain holding the
# certificate and an App Store Connect key to notarise with, the same two
# things diaryx's appstore-release.yml sets up, from secrets of the same names:
#
#   APPLE_CERTIFICATE           the Developer ID Application identity, as a
#   APPLE_CERTIFICATE_PASSWORD  base64 .p12 and the password it was exported with
#   APPLE_API_KEY_BASE64        the App Store Connect API key (.p8), base64,
#   APPLE_API_KEY_ID            its key id,
#   APPLE_API_ISSUER_ID         and its issuer id
#
# Then the `cask` job points `Casks/leaf-editor.rb` in diaryx-org/homebrew-tap
# at the new image, pushing as the diaryx-bot GitHub App (TAP_APP_ID,
# TAP_APP_KEY) the way homebrew.yml's formula bump does.
#
# Fires on the same `v*.*.*` tags homebrew.yml does. Dispatched by hand it
# builds, signs and notarises whatever ref it is run on and keeps the image as
# a workflow artifact, touching no release — the way to rehearse this before a
# tag depends on it. Dispatched with `cask-tag` it builds nothing and only
# writes the cask for that tag's already-attached image.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch:
    inputs:
      cask-tag:
        description: "Only write the tap's cask for this released tag (e.g. v0.4.12), building nothing"
        required: false
        type: string

permissions:
  contents: write # attaches the image to the GitHub Release; the tap is the App's

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Sign and notarise Leaf.app
    # Apple Silicon: the image is aarch64 only, as the Rust staticlib is.
    runs-on: macos-latest
    if: inputs.cask-tag == ''
    steps:
    - uses: actions/checkout@v7

    # The app icon is an Icon Composer `.icon`, which only Xcode 26 and later
    # compile, and macos-latest can still default to an older Xcode.
    - uses: maxim-lobanov/setup-xcode@v1
      with: { xcode-version: latest-stable }

    # The Xcode project is git-ignored and regenerated by `cargo xtask package`.
    - name: Install XcodeGen
      env: { HOMEBREW_NO_AUTO_UPDATE: 1, HOMEBREW_NO_INSTALL_CLEANUP: 1 }
      run: brew install xcodegen

    # From inside the checkout, so rustup installs what rust-toolchain.toml
    # pins rather than whatever `stable` is — the pin stays stated in one file.
    # The project's pre-build script builds the staticlib with it.
    - name: Install the pinned toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@v2

    - name: Write the App Store Connect API key
      env:
        APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      run: |
        set -euo pipefail
        key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
        printf '%s' "$APPLE_API_KEY_BASE64" | base64 -d > "$key"
        chmod 600 "$key"
        echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

    # A keychain of the run's own, first in the search list, so that
    # `security find-identity` finds the certificate and codesign may use its
    # key without the prompt a desktop would show.
    - name: Import the Developer ID certificate
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        set -euo pipefail
        keychain="$RUNNER_TEMP/developer-id.keychain-db"
        password="$(openssl rand -hex 16)"
        security create-keychain -p "$password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$password" "$keychain"
        # Split on purpose: the existing search list, one path per word.
        # shellcheck disable=SC2046
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        cert="$RUNNER_TEMP/developer-id.p12"
        printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$cert"
        security import "$cert" -P "$APPLE_CERTIFICATE_PASSWORD" \
          -A -t cert -f pkcs12 -k "$keychain"
        rm "$cert"
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$password" "$keychain" >/dev/null
        echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

    - name: Package
      env:
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      run: cargo xtask package

    # The image is named from the bundle's own version, which `cargo xtask
    # sync-versions` writes into project.yml at the bump. A tag whose image
    # names another version would be the cask downloading the wrong app.
    - name: Check the image is the tag's version
      if: github.ref_type == 'tag'
      env: { TAG: "${{ github.ref_name }}" }
      run: |
        set -euo pipefail
        expected="target/package/Leaf-${TAG#v}-aarch64.dmg"
        if [ ! -f "$expected" ]; then
          echo "::error::expected $expected, found: $(ls target/package)"
          exit 1
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: leaf-mac-app
        path: target/package/*.dmg
        if-no-files-found: error

    # No `body`: the release notes are `release github-release`'s, and the
    # action keeps an existing body when it is given none — see the same step
    # in diaryx-org/.github's reusable-homebrew.yml.
    - name: Attach to the GitHub Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        files: target/package/*.dmg

    - name: Delete the keychain
      if: always() && env.KEYCHAIN != ''
      run: security delete-keychain "$KEYCHAIN"

  cask:
    name: Bump tap cask
    needs: [package]
    # `always()` so that a `cask-tag` dispatch, which skips `package`, still
    # runs; on a tag it waits for the image to be attached.
    if: >-
      always() && (inputs.cask-tag != '' ||
      (github.ref_type == 'tag' && needs.package.result == 'success'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Hashed from the released URL itself — the bytes `brew install` will
    # download, not a copy that passed between jobs.
    - name: Render the cask
      env:
        TAG: ${{ inputs.cask-tag || github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        version="${TAG#v}"
        url="https://github.com/$REPO/releases/download/$TAG/Leaf-$version-aarch64.dmg"
        sha256=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
        scripts/render-cask.sh "$version" "$sha256" > "$RUNNER_TEMP/leaf-editor.rb"
        cat "$RUNNER_TEMP/leaf-editor.rb"
        echo "VERSION=$version" >> "$GITHUB_ENV"

    - name: Mint a tap token from the GitHub App
      id: tap_token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.TAP_APP_ID }}
        private-key: ${{ secrets.TAP_APP_KEY }}
        owner: diaryx-org
        repositories: homebrew-tap

    - name: Push to the tap
      env:
        COMMITTER_TOKEN: ${{ steps.tap_token.outputs.token }}
      run: |
        set -euo pipefail
        git clone "https://x-access-token:${COMMITTER_TOKEN}@github.com/diaryx-org/homebrew-tap" tap
        mkdir -p tap/Casks
        cp "$RUNNER_TEMP/leaf-editor.rb" tap/Casks/leaf-editor.rb
        cd tap
        git config user.name "diaryx-bot[bot]"
        git config user.email "306900725+diaryx-bot[bot]@users.noreply.github.com"
        git add Casks/leaf-editor.rb
        if git diff --cached --quiet; then
          echo "Cask unchanged — skipping commit"
        else
          git commit -m "leaf-editor $VERSION"
          git push
        fi
