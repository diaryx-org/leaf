[package]
name = "leaf-ratatui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Embeddable rich-text editor widget for ratatui: renders leaf-core's WYSIWYG/source view into a Rect and turns key/mouse events into document edits. The terminal peer of leaf-gpui."

[features]
default = ["images", "theme-detect"]
# Block-level image rasterization via the terminal's graphics protocol. On by
# default so hosts get pictures for free. Turning it off drops the ratatui-image
# + image (codec) dependencies entirely; block images then fall back to core's
# inline `🖼 alt` placeholder text — the same fallback a terminal with no
# graphics protocol already gets. Everything else (text, code boxes, selection,
# input) is unchanged.
images = ["dep:ratatui-image", "dep:leaf-raster"]
# Ask the terminal whether it is light or dark (an `OSC 11` query) so the
# palette can match it. On by default: a code panel tinted for the wrong
# background is the single most visible way the surface can look broken, and
# the environment alone (`COLORFGBG`) answers on only a handful of terminals.
# Turning it off drops the terminal-colorsaurus dependency; detection then
# falls back to `LEAF_THEME`/`COLORFGBG`, and to dark when neither is set.
theme-detect = ["dep:terminal-colorsaurus"]

[dependencies]
# Frontend-neutral core: the caret/selection model + AST→glyph VisualMap.
leaf-core.workspace = true
# TUI framework; we use its re-exported crossterm so backend versions can't skew.
ratatui = "0.29"
# Block-level images painted with the terminal's own graphics protocol (kitty,
# iTerm2, sixel) and a unicode-halfblock fallback everywhere else. Version 9 is
# the line built against ratatui 0.29 — 10+ require ratatui 0.30, which would
# skew the backend. `default-features = false` drops the `chafa-dyn` default
# (a build-time libchafa/pkg-config C dependency); the built-in encoders need no
# C libs. `crossterm` matches the backend ratatui already uses here. Optional:
# pulled in only by the `images` feature.
ratatui-image = { version = "9", default-features = false, features = ["crossterm"], optional = true }
# The shared CPU rasterization layer: image decode (SVG included), the fit
# policy, path resolution, and the oversized-heading rasters with the caret and
# selection painted into the pixels. It re-exports `image`, pinned to the same
# 0.25 line ratatui-image builds against, so the `DynamicImage`s handed across
# resolve to one crate version. Optional: only the `images` feature wants any
# of it — without a graphics protocol the ordinary bold coloured heading and
# the `🖼 alt` placeholder are the better rendering anyway.
leaf-raster = { workspace = true, optional = true }
# "Is this terminal dark or light?", asked properly: an `OSC 11` query with a
# timeout, a fast heuristic for terminals that won't answer, no escape sequences
# at all under `TERM=dumb`, and a guaranteed termios restore even on panic. It
# talks to the controlling tty directly rather than to stdin, so it can't steal
# a keystroke out from under the crossterm event loop — which is exactly why
# this isn't hand-rolled. Optional: pulled in only by the `theme-detect`
# feature.
terminal-colorsaurus = { version = "1", optional = true }
