[package]
name = "leaf-mermaid-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly binding for leaf-mermaid: Mermaid diagrams to SVG, as a module of its own that a host's fence editor fetches. leaf-web never imports it."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leaf-mermaid.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
