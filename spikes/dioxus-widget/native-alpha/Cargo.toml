# The experimental native backend, in a workspace of its own because it cannot
# share the parent's: `dioxus-native` is published only for 0.8.0-alpha.2, and
# a 0.8 `Element` is not a 0.7 `Element`. So this crate pins the alpha, and
# reuses the parent for everything that is not a Dioxus type — `style`, `rows`
# and `frame`, through `default-features = false`.
#
# Blitz draws through wgpu rather than a webview: the same component tree, the
# same document, no HTML engine. It is the third screenshot in ../README.md.
[workspace]

[package]
name = "dioxus-native-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "0.8.0-alpha.2", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }
# dioxus-native's defaults, but the classic `vello` renderer for
# `vello-hybrid`: hybrid cannot draw a bitmap glyph — with glifo's `png` on,
# vello_gpu panics ("pixmap image sources are not supported by Vello GPU"),
# and without it every emoji (Apple Color Emoji is sbix PNGs) draws as
# nothing. Classic vello draws them.
dioxus-native = { version = "0.8.0-alpha.2", default-features = false, features = [
    "accessibility", "net", "html", "svg", "system-fonts", "clipboard", "file-dialog",
    "woff", "text-transform-icu", "apple-font-embolden", "vello",
] }
# The bridge, with the parent's own Dioxus (0.7.10) switched off.
dioxus-widget-spike = { path = "..", default-features = false }
# `fs` on, unlike the parent's widget: this is an app with a file to open and
# save, which is what `Doc::open` and `Doc::save` are.
leaf-core = { path = "../../../crates/leaf-core", default-features = false, features = [
    "fs",
    "syntax",
] }
# The system clipboard. Already in the tree through Blitz's own `clipboard`
# feature, so it costs no new crate.
arboard = "3.7"
# A timer for work that should wait for the typing to stop (the word count).
# Already in the tree: dioxus-native builds and enters a tokio runtime with
# timers enabled, which is what makes `tokio::time::sleep` work in a task.
tokio = { version = "1", default-features = false, features = ["time"] }
# Text layout, for proportional rows (`text.rs`). The same parley Blitz shapes
# with, at the version it pins, so both measure the same glyphs.
parley = "=0.12.0"
# Display columns — core's unit for a caret column — as core counts them.
unicode-width = "0.2"
# Grapheme clusters, the unit a column advances by, as core walks them.
unicode-segmentation = "1.13"

# Block pictures (`media.rs`): a picture's size off its header, an SVG's off
# its canvas, so the block's height is known before Blitz has decoded it. Both
# already in the tree through Blitz, at the formats it decodes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
usvg = { version = "0.48", default-features = false }

# The menu bar (`menu.rs`): Tauri's, the native NSMenu on macOS.
muda = "0.21"
# File dialogs and the unsaved-changes prompt (`file.rs`). Already in the tree
# through Blitz's own `file-dialog` feature.
rfd = "0.17"

# The Character Viewer (⌃⌘Space), which AppKit only offers through an Edit
# menu this app does not have. The versions winit-appkit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
# The context menu (`menu::show_context`): the window's NSView, through the
# handle winit already exposes, and the main queue to pop the menu up from.
# Both already in the tree, through winit and objc2.
raw-window-handle = "0.6"
dispatch2 = "0.3"

# winit's macOS backend, vendored at the version dioxus-native pins and
# patched (see patches/winit-appkit/PATCH.md): its text input client answered
# no questions about the text around the caret, so macOS's press-and-hold
# accent menu never opened, and it dropped any insertText that did not end a
# composition, which is how the emoji picker inserts.
[patch.crates-io]
winit-appkit = { path = "patches/winit-appkit" }
