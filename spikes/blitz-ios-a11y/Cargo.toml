# Spike: does VoiceOver on iOS read a Blitz page, through AccessKit's iOS
# adapter? A one-window Dioxus page on blitz-shell, its accessibility tree
# built by blitz-dom and handed to `accesskit_ios`, whose `SubclassingAdapter`
# takes over winit's UIView. Run with `scripts/run.sh` (README.md).
[workspace]

[package]
name = "blitz-ios-a11y"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "BlitzA11y"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-native = { version = "0.8.0-alpha.3", default-features = false, features = ["system-fonts", "vello"] }
blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
# `accessibility` here only: blitz-shell's would bring accesskit_xplat, which
# has no iOS adapter and does nothing there.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["accessibility", "system-fonts"] }
blitz-traits = "=0.3.0-beta.4"
# The CPU renderer: Vello on the GPU needs indirect execution, which the
# simulator's Metal lacks.
anyrender_vello_cpu = { version = "0.18", features = ["softbuffer_window_renderer"] }
accesskit = "0.25"
accesskit_ios = "0.2.1"
raw-window-handle = "0.6"
# The self-test (`BLITZ_A11Y_ACTIVATE`): UIKit's accessibility calls, as VoiceOver makes them.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }

[patch.crates-io]
# winit-uikit 0.31.0-beta.3 with rust-windowing/winit#4723 (the UIScene
# lifecycle), without which an app built with the iOS 27 SDK does not launch:
# leaf's patches/winit-uikit (PATCH.md there).
winit-uikit = { path = "../../patches/winit-uikit" }
# Blitz's accessibility tree, made readable and pressable: diaryx-org's fork,
# its `leaf` branch (FORK.md there).
# Every Blitz crate in the graph comes from the fork: the fork's crates
# depend on each other by path, so one from crates.io beside them would be
# a second copy.
blitz-dom = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-traits = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-shell = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-paint = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
stylo_taffy = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
debug_timer = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }

# Blitz is unusably slow unoptimised; this crate stays debuggable.
[profile.dev.package."*"]
opt-level = 3
