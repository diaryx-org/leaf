# How big mmdr is as a web module: one exported function, nothing else.
[workspace]

[package]
name = "mermaid-wasm-size"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
wasm-bindgen = "=0.2.127"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

strip = true

# mmdr 0.3.1 panics on wasm32-unknown-unknown: its layout reads
# `std::time::Instant`. To measure a working module, patch a copy whose
# `std::time::Instant` is `web_time::Instant` (four files, and `web-time = "1"`
# in its manifest), then add here:
#
#   [patch.crates-io]
#   mermaid-rs-renderer = { path = "<the patched copy>" }
