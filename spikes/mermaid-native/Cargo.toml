# A spike, not a leaf crate: its own workspace, so leaf takes no dependency
# on a Mermaid renderer until the results in README.md say it should.
[workspace]

[package]
name = "mermaid-native-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# The versions leaf already carries, so the raster here is the one leaf's
# formulas go through.
resvg = "0.46"
usvg = "0.46"
