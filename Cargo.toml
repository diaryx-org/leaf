[workspace]
resolver = "3"
# The Rust libraries under the Dioxus frontend: the core, and what it draws
# formulas, diagrams and pictures with. xtask is a member so `cargo xtask`
# shares this lockfile.
members = ["crates/*", "xtask"]
# crates/leaf-dioxus, the Dioxus widget, and crates/leaf-dioxus-ui, its menus
# and dialogs, are each a workspace of their own: they are on Dioxus 0.8's
# alpha, whose winit beta and wgpu tree nothing here should resolve. Their
# apps, apps/leaf-dioxus and apps/leaf-dioxus-tui, are outside `members`
# already. Build each from its own manifest:
#
#     cargo build --manifest-path apps/leaf-dioxus/Cargo.toml
#
# The other frontends (Swift, web, gpui, Android and the ratatui TUI) are
# archived under archive/; see archive/README.md. Nothing here builds them.
exclude = ["crates/leaf-dioxus", "crates/leaf-dioxus-ui"]
# A bare `cargo build` builds the libraries, not the task runner.
default-members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/leaf"
readme = "README.md"

[workspace.dependencies]
# The document AST + offset-addressed span-splice editor. twig is pure Rust
# since 6.0, and its core names no language: each one leaf opens is a crate
# that registers itself with twig on first use (`twig_markdown::format()`), and
# leaf's own `leaf_core::Format` is what picks among them. Without twig-doc's
# default `fig` feature: that is `twig::meta` (frontmatter read and edited
# through fig, and a document's `twig:` key obeyed), which leaf never asks for,
# and it would bring fig's YAML, TOML, JSON and figl parsers with it.
twig-doc = { version = "6", default-features = false }
twig-markdown = "6"
twig-djot = "6"
twig-html = "6"
twig-asciidoc = "6"
twig-xml = "6"
# The CSS inside a `style` attribute: the presentation vocabulary is written
# there, so another app renders it, and every edit to it keeps the declarations
# leaf did not write. Shared with thorn, which edits an SVG's `style` the same way.
fig-css = { git = "https://github.com/diaryx-org/fig-css", branch = "main" }
anyhow = "1"
# Frontend-neutral core: the caret/selection model + AST→glyph map, styled with
# a toolkit-agnostic Style. Each frontend crate maps that to its own styling.
leaf-core = { path = "crates/leaf-core", version = "0.5.1" }
# Backend-neutral CPU rasterization: image decode/fit/path policy plus the
# oversized-heading rasters with caret/selection painted into the pixels.
leaf-raster = { path = "crates/leaf-raster", version = "0.5.1" }
# TeX math to a self-contained SVG picture with baseline metrics, through
# RaTeX; every frontend that paints a formula goes through it.
leaf-math = { path = "crates/leaf-math", version = "0.5.1" }
# The structural formula editor — keys in, splices on the TeX out — without
# its twig half, which only its own demo needs.
leaf-math-edit = { path = "crates/leaf-math-edit", version = "0.5.1", default-features = false }
leaf-session = { path = "crates/leaf-session", version = "0.5.1" }
# Mermaid diagrams to SVG, through mmdr, for a host's fence editor to draw.
# The Dioxus editor draws a fence through it.
leaf-mermaid = { path = "crates/leaf-mermaid", version = "0.5.1" }

# mmdr optimised even in a debug build: unoptimised, its flowchart layout is
# some six times slower (a 20-node chart 244 ms against 40 ms), which makes
# a debug build a poor guide to what Diaryx ships.
# A profile here governs only builds of this workspace.
[profile.dev.package.mermaid-rs-renderer]
opt-level = 3
