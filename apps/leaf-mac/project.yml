name: Leaf
options:
  bundleIdPrefix: org.diaryx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Leaf for the Mac: a SwiftUI document app whose editor is leaf-dioxus — the
# Rust editor drawn by Blitz on wgpu — in a view of the app's own
# (`LeafEditorView`, over `crates/leaf-dioxus-embed`'s C ABI). Everything
# around the editor is native: `DocumentGroup`'s windows, autosave, Versions
# and recents; the menus; the toolbar; the Settings window; the context menu;
# the text input client, so press-and-hold, the Character Viewer and
# dictation are AppKit's own.
#
# The iOS app is still `apps/leaf-editor`, over LeafUI. The two cannot share a
# target: each links a Rust staticlib, and two in one binary carry two copies
# of Rust's runtime. The icon, the sample and its media are that app's, used
# from there.
# The repository's own Swift package, for LeafToolbar alone: the formatting
# toolbar, which links no Rust. LeafUI would bring leaf-ffi's staticlib, and
# a second Rust runtime with it.
packages:
  Leaf:
    path: ../..

targets:
  Leaf:
    type: application
    platform: macOS
    dependencies:
      - package: Leaf
        product: LeafToolbar
    sources:
      - path: App
        excludes: [Info.plist]
      # The icon, from the Icon Composer source the iOS app uses too.
      - path: ../leaf-editor/App/leaf.icon
      # The sample document and its attachments, copied into the bundle so
      # Help ▸ Open Sample Document has real files to resolve its relative
      # sources against.
      - path: ../leaf-editor/App/Sample.md
        buildPhase: resources
      - path: ../leaf-editor/App/Media
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Djot Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [org.djot.djot]
          - CFBundleTypeName: HTML Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.djot.djot
            UTTypeDescription: Djot Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [dj, djot]
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.diaryx.leaf
        PRODUCT_NAME: Leaf
        # The workspace version, written here by `cargo xtask sync-versions`.
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: leaf
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Leaf
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT or Apache-2.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        SWIFT_VERSION: "5.0"
        ONLY_ACTIVE_ARCH: YES
        ARCHS: arm64
        # The C ABI, declared by the crate beside its source.
        SWIFT_OBJC_BRIDGING_HEADER: App/Leaf-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/../../crates/leaf-dioxus-embed/include"
        # Unsigned here, as apps/leaf-editor's are; `cargo xtask package` signs
        # from the xcodebuild command line, which outranks these.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        # A document app cannot read the images beside a file it was handed
        # from inside the sandbox without asking for the folder — see
        # docs/tasks/sandboxed-mac-app.md.
        ENABLE_APP_SANDBOX: NO
        # The editor's staticlib, which the pre-build script below builds, and
        # what it links against: Metal for wgpu, Carbon for the keyboard
        # layout winit's key types read, the rest for fonts, the network
        # provider and the clipboard.
        OTHER_LDFLAGS:
          - "$(LEAF_EMBED_LIB)"
          - "-lc++"
          - "-framework"
          - "Carbon"
          - "-framework"
          - "Metal"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "IOKit"
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
        LEAF_EMBED_LIB: "$(PROJECT_DIR)/../../crates/leaf-dioxus-embed/target/debug/libleaf_dioxus_embed.a"
      configs:
        Release:
          LEAF_EMBED_LIB: "$(PROJECT_DIR)/../../crates/leaf-dioxus-embed/target/release/libleaf_dioxus_embed.a"
    preBuildScripts:
      - name: "Build leaf-dioxus-embed staticlib"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(LEAF_EMBED_LIB)"
        shell: /bin/bash
        script: |
          set -euo pipefail
          # Xcode's build environment has a minimal PATH.
          export PATH="$HOME/.nix-profile/bin:$HOME/.cargo/bin:$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          cd "${PROJECT_DIR}/../.."
          [ "${CONFIGURATION}" = "Release" ] && FLAGS="--release" || FLAGS=""
          echo "leaf-dioxus-embed: cargo build ${FLAGS}"
          cargo build --manifest-path crates/leaf-dioxus-embed/Cargo.toml ${FLAGS}

schemes:
  Leaf:
    build:
      targets:
        Leaf: all
    run:
      config: Debug
