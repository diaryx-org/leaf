# Leaf on Dioxus's native renderer (Blitz): the `leaf-dioxus` editor widget
# (crates/leaf-dioxus) in a Mac document app — its menu bar, file dialogs,
# settings file and settings panel — as apps/leaf is the gpui one over
# leaf-gpui.
#
# A workspace of its own, like apps/leaf: `dioxus-native` is published only
# as 0.8.0-alpha.2, which pins a winit beta and a large wgpu tree that
# nothing in leaf's root workspace should resolve, and its winit backend is
# patched below — a [patch] applies only at the root of the workspace that
# has it, which is also why the widget's workspace has none. Build it by
# manifest:
#
#     cargo run --manifest-path apps/leaf-dioxus/Cargo.toml -- document.md
[workspace]

[package]
# Not `leaf-dioxus`, which is the widget's name: one graph cannot hold two
# packages by one name. The binary keeps it.
name = "leaf-dioxus-app"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "leaf-dioxus"
path = "src/main.rs"

[dependencies]
# The editor: everything drawn in the window but the settings panel.
leaf-dioxus = { path = "../../crates/leaf-dioxus" }
dioxus = { version = "0.8.0-alpha.2", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }
# dioxus-native's defaults, but the classic `vello` renderer for
# `vello-hybrid`, which the widget asks for (its Cargo.toml says why: emoji).
dioxus-native = { version = "0.8.0-alpha.2", default-features = false, features = [
    "accessibility", "net", "html", "svg", "system-fonts", "clipboard", "file-dialog",
    "woff", "text-transform-icu", "apple-font-embolden", "vello",
] }
# `fs` on, unlike the widget's: this is an app with a file to open and save,
# which is what `Doc::open` and `Doc::save` are.
leaf-core = { path = "../../crates/leaf-core", default-features = false, features = [
    "fs",
    "syntax",
] }
# The menu bar's poll. Already in the tree: dioxus-native builds and enters a
# tokio runtime with timers enabled, which is what makes `tokio::time::sleep`
# work in a task.
tokio = { version = "1", default-features = false, features = ["time"] }

# The menu bar (`menu.rs`): Tauri's, the native NSMenu on macOS.
muda = "0.21"
# File dialogs and the unsaved-changes prompt (`file.rs`). Already in the tree
# through Blitz's own `file-dialog` feature.
rfd = "0.17"

# The Character Viewer (⌃⌘Space), which AppKit only offers through an Edit
# menu this app does not have. The versions winit-appkit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
# The context menu (`menu::show_context`): the window's NSView, through the
# handle winit already exposes, and the main queue to pop the menu up from.
# Both already in the tree, through winit and objc2.
raw-window-handle = "0.6"
dispatch2 = "0.3"

# winit's macOS backend, vendored at the version dioxus-native pins and
# patched (see patches/winit-appkit/PATCH.md): its text input client answered
# no questions about the text around the caret, so macOS's press-and-hold
# accent menu never opened, and it dropped any insertText that did not end a
# composition, which is how the emoji picker inserts.
#
# An exception to the org rule against [patch] in a tracked manifest, granted
# by Adam on 2026-10-15 for the spike this app began as, and kept when it was
# promoted. The rule keeps each org crate spelled one way in every manifest;
# this patches a third-party crate, vendored inside the repository, in a
# workspace nothing depends on — and winit-appkit reaches the app only
# transitively (dioxus-native → blitz-shell → winit), which nothing but
# [patch] can override. It goes when the change lands upstream (PATCH.md,
# "Upstream") and Blitz takes that winit.
[patch.crates-io]
winit-appkit = { path = "patches/winit-appkit" }
