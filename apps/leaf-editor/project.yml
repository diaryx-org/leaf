name: Leaf
options:
  bundleIdPrefix: org.diaryx
  deploymentTarget:
    iOS: "16.0"
    macOS: "12.0"
  createIntermediateGroups: true

# Leaf, the document app — one cross-platform host for the `LeafUI` editor. The
# same SwiftUI sources build for macOS (AppKit surface) and iOS (UIKit surface);
# `LeafUI` already carries both renderers, so `App/` is chrome only: the
# document classes, the menus, the settings, and the display choices.
#
# The editor is consumed as a local Swift package: `LeafUI` (the renderer) →
# `LeafFFI` (the generated binding, built from source) → the C module in
# `packages/leaf-swift/uniffi-generated/headers`. The package manifest lives at
# the repo root (SwiftPM's requirement for by-version consumption), so the local
# path is the repo itself. The Rust staticlib is force-loaded (below) and rebuilt
# by the pre-build script every Xcode build, so Rust changes always take effect
# without re-running `bootstrap.sh` (needed only on first setup or when the Rust
# *API* changes and the binding must be regenerated).
packages:
  LeafFFI:
    path: ../..

targets:
  Leaf:
    type: application
    # A single multiplatform target: Xcode builds it for whichever destination is
    # selected (My Mac / an iOS simulator / a device). `LeafUI` compiles the
    # matching AppKit or UIKit surface behind `#if canImport(...)`.
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
        excludes: [Media, Sample.md, Info.plist]
      # The sample document and its attachments, copied into the bundle so Help ▸
      # Open Sample Document has real files to resolve its relative sources
      # against.
      - path: App/Sample.md
        buildPhase: resources
      - path: App/Media
        buildPhase: resources
    dependencies:
      - package: LeafFFI
        product: LeafUI
    # The document types, which is what puts Leaf in Finder's Open With and the
    # Files app's share sheet, and lets the Open panel enable a `.md`. xcodegen
    # writes these into App/Info.plist (git-ignored, regenerated with the
    # project); the INFOPLIST_KEY_* settings below merge into it at build time.
    info:
      path: App/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Djot Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [org.djot.djot]
          - CFBundleTypeName: HTML Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html]
        # Djot has no system type. Imported rather than exported: Leaf is not
        # the format's owner, only a reader that needs `.dj` to mean something.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.djot.djot
            UTTypeDescription: Djot Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [dj, djot]
        # A document app on iOS opens to the browser; without this key it opens
        # to a blank scene.
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.diaryx.leaf
        PRODUCT_NAME: Leaf
        # The workspace version, written here by `cargo xtask sync-versions`
        # as part of a release bump; the build number is a timestamp so a
        # rebuild of the same version still reads as a newer bundle.
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "1"
        # App icon, from the Icon Composer source at App/leaf.icon (picked up
        # automatically — it's a normal member of the App/ sources path above).
        # actool compiles it straight into every icon size/appearance for both
        # platforms, no .xcassets entry needed.
        ASSETCATALOG_COMPILER_APPICON_NAME: leaf
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Per-key values (incl. iOS-only ones) come from INFOPLIST_KEY_* below,
        # SDK-conditional where they differ, and merge into App/Info.plist.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Leaf
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT or Apache-2.0"
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphoneos*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphonesimulator*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # macOS: an ordinary windowed app.
        "INFOPLIST_KEY_LSApplicationCategoryType[sdk=macosx*]": public.app-category.productivity
        # Language mode 5 — the Swift-6 strict-concurrency checker would reject the
        # FFI handle crossing the main-actor boundary; the model serialises access.
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        ONLY_ACTIVE_ARCH: YES
        # Simulator/local run needs no signing — no Apple developer team
        # required, and `cargo xtask swift` builds on a machine without one.
        "CODE_SIGNING_ALLOWED[sdk=macosx*]": NO
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
        "CODE_SIGNING_REQUIRED[sdk=macosx*]": NO
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
        "CODE_SIGN_IDENTITY[sdk=macosx*]": ""
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
        # A real iPhone refuses an unsigned binary ("The executable is not
        # codesigned"), and a device build needs a provisioning profile, which
        # needs a team — automatic signing then mints and renews the profile
        # itself. Set here rather than in Xcode's Signing & Capabilities pane:
        # the .xcodeproj is gitignored and regenerated, so a change made in the
        # UI is lost at the next `xcodegen generate`. Same team and reasoning
        # as diaryx's apps/swift/project.yml.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V4322HH5HU
        # macOS won't launch a sandboxed app that isn't signed, and a sandboxed
        # document app cannot read the images beside a file it was handed
        # without asking for the folder — see docs/tasks/sandboxed-mac-app.md.
        # Until both are answered it runs unsandboxed.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": NO
        # Force-load the Rust staticlib the pre-build script produces. The path is
        # SDK-conditional (mac vs sim vs device); $(LEAF_STATIC_LIB) picks the match.
        # PROJECT_DIR is apps/leaf-editor → ../.. is the repo root whose `target/`
        # cargo writes into.
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(LEAF_STATIC_LIB)"
        "LEAF_STATIC_LIB[sdk=macosx*]": "$(PROJECT_DIR)/../../target/aarch64-apple-darwin/debug/libleaf_ffi.a"
        "LEAF_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/debug/libleaf_ffi.a"
        "LEAF_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/debug/libleaf_ffi.a"
      configs:
        Release:
          "LEAF_STATIC_LIB[sdk=macosx*]": "$(PROJECT_DIR)/../../target/aarch64-apple-darwin/release/libleaf_ffi.a"
          "LEAF_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release/libleaf_ffi.a"
          "LEAF_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/release/libleaf_ffi.a"
    preBuildScripts:
      - name: "Build leaf-ffi staticlib"
        basedOnDependencyAnalysis: false
        # Declaring the staticlib as an output tells the build system this phase
        # produces it, so it schedules before the link step and doesn't fail the
        # planning-stage "input file not found" check when the .a doesn't exist yet.
        outputFiles:
          - "$(LEAF_STATIC_LIB)"
        shell: /bin/bash
        script: |
          set -euo pipefail
          # Xcode's build env has a minimal PATH; add the user's toolchains.
          export PATH="$HOME/.nix-profile/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          cd "${PROJECT_DIR}/../.."        # repo root (workspace Cargo.toml)

          case "${PLATFORM_NAME}" in
            macosx)           RUST_TARGET="aarch64-apple-darwin" ;;
            iphonesimulator)  RUST_TARGET="aarch64-apple-ios-sim" ;;
            *)                RUST_TARGET="aarch64-apple-ios" ;;
          esac
          [ "${CONFIGURATION}" = "Release" ] && CARGO_FLAGS="--release" || CARGO_FLAGS=""

          echo "leaf-ffi: cargo build -p leaf-ffi --target ${RUST_TARGET} ${CARGO_FLAGS}"
          rustup target add "${RUST_TARGET}" 2>/dev/null || true
          cargo build -p leaf-ffi --target "${RUST_TARGET}" ${CARGO_FLAGS}

  # The iOS selection surface is the system's, not ours: `UITextInteraction`
  # drives the double-tap, the handles and the edit menu through the
  # `UITextInput` conformance. Nothing about that is reachable from a unit test,
  # so this target taps the real thing on a simulator. iOS only.
  LeafUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [UITests]
    dependencies:
      - target: Leaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.diaryx.leaf.uitests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TEST_TARGET_NAME: Leaf

schemes:
  Leaf:
    build:
      targets:
        Leaf: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [LeafUITests]
