<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon's source. A leaf on the site's green, drawn as a lens with a
       midrib; `scripts/app-icon.sh` rasterises it into the asset catalog. The
       backdrop is inset, as Apple's template asks (a macOS icon is drawn at
       824 of 1024 and the system rounds it), so a corner is never clipped. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26a08d"/>
      <stop offset="1" stop-color="#177b6c"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#g)"/>
  <g transform="translate(512 512) rotate(-40)">
    <path d="M0 -300 C 210 -180, 210 180, 0 300 C -210 180, -210 -180, 0 -300 Z"
          fill="#fbfbf9"/>
    <path d="M0 -240 L0 250" stroke="#1e8f7e" stroke-width="22" stroke-linecap="round"/>
    <path d="M0 -60 L92 -150 M0 40 L112 -60 M0 140 L102 50 M0 -60 L-92 -150 M0 40 L-112 -60 M0 140 L-102 50"
          stroke="#1e8f7e" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>
</svg>
