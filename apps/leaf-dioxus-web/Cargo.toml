# Leaf in a browser tab: the leaf-dioxus editor widget (crates/leaf-dioxus),
# drawn by Blitz into a canvas through WebGPU, on `wasm32-unknown-unknown`.
# The same editor as the Mac app's, measured and drawn by one engine; the
# page around it is `index.html`. README.md says what works and what does not.
#
# A workspace of its own, for the reason the Mac app is one: dioxus-native's
# alpha pins a winit beta and a wgpu tree that leaf's root workspace should
# not resolve. Built for the browser by wasm-pack, into `pkg/`, and served
# from this directory by any static server:
#
#     wasm-pack build apps/leaf-dioxus-web --target web --release --no-typescript --no-pack
#     python3 -m http.server -d apps/leaf-dioxus-web
#
# There is nothing to build off the web: every line of the crate is behind
# `cfg(target_arch = "wasm32")`.
[workspace]

[package]
name = "leaf-dioxus-web"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Default features off: the system clipboard is arboard's, which has no
# browser; this host brings its own (`lib.rs`). And classic `vello` off, for
# the hybrid renderer below.
leaf-dioxus = { path = "../../crates/leaf-dioxus", default-features = false }
leaf-core = { path = "../../crates/leaf-core", default-features = false, features = ["syntax"] }
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }
# Blitz's hybrid renderer, the one Blitz's own wasm examples draw with, and
# the one built for GPUs as small as WebGL 2's (README.md says what stands
# between it and WebGL). It draws no bitmap glyph, so no colour emoji; the
# faces this host brings have none anyway.
dioxus-native = { version = "0.8.0-alpha.3", default-features = false, features = [
    "net", "svg", "system-fonts", "vello-hybrid",
] }
# Fonts for SVG text, which usvg sets from a database of its own
# (`add_svg_fonts`, from the fork patched in below).
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
# Blitz's font collection, built here from the faces the page brings — a
# browser lists no system fonts. The parley Blitz and the editor pin.
parley = "=0.12.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window"] }
# A panic, in the browser's console rather than as `unreachable`.
console_error_panic_hook = "0.1"

# Stylo, parley and Vello want every optimisation they can get; the size is
# brotli's to cut when the bundle is served (README.md).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Binaryen's pass takes minutes over a bundle this size, and brotli saves more
# when the bundle is served.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[patch.crates-io]
# Blitz from diaryx-org's fork, its `leaf` branch, as the Mac app takes it
# (FORK.md there): the same engine on both, and the fork's fixes with it —
# among them the hit test's skipping a node removed since the last layout,
# which a browser reaches often. Its frames wait for `requestAnimationFrame`,
# so a click can land between a change to the page and the layout that
# follows it, and crates.io's Blitz then panics on the removed node. Every
# Blitz crate in the graph, so none comes from crates.io beside them.
blitz-dom = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-traits = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-shell = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-paint = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
blitz-net = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
stylo_taffy = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
debug_timer = { git = "https://github.com/diaryx-org/blitz", branch = "leaf" }
