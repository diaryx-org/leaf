# A prototype: the leaf-dioxus editor (crates/leaf-dioxus), the same
# component the Mac app draws with Blitz on wgpu, drawn in a terminal instead.
# Blitz still builds the DOM, resolves the styles and lays the page out;
# blitz-tui, in the Blitz fork, walks the laid-out tree and writes character
# cells where blitz-paint would draw pixels. The Blitz fork is reached by
# the [patch] in leaf's root Cargo.toml.
#
#     cargo run -p leaf-dioxus-tui -- document.md
[package]
name = "leaf-dioxus-tui"
version.workspace = true
edition = "2024"
publish = false

[[bin]]
name = "leaf-dtui"
path = "src/main.rs"

[dependencies]
leaf-dioxus = { path = "../../crates/leaf-dioxus" }
leaf-core = { path = "../../crates/leaf-core", default-features = false, features = ["fs", "syntax"] }
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }
# The document type and Blitz's DOM, with no renderer: nothing here draws
# pixels. `system-fonts` because the editor and Blitz shape text with parley
# over the system's fonts, and a monospace face's advance is the cell.
dioxus-native = { version = "0.8.0-alpha.3", default-features = false, features = ["system-fonts"] }
dioxus-core = "=0.8.0-alpha.3"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
# The painter, the terminal and its input: Blitz's page as character cells,
# pictures through the graphics protocol, from the fork's `leaf` branch.
blitz-tui = { git = "https://github.com/diaryx-org/blitz", branch = "leaf", features = ["winit"] }
# The terminal's events, as blitz-tui reads them.
crossterm = "0.28"
# Pictures, formulas and diagrams decoded and rasterised by leaf-raster, as
# leaf-tui does, for blitz-tui to draw.
leaf-raster = { path = "../../crates/leaf-raster" }
# The menus and dialogs round the editor, as the Mac app draws them, in
# their cell density.
unit = { git = "https://github.com/diaryx-org/unit", branch = "main" }
anyhow = "1"
libc = "0.2"
# The editor's timers.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"] }
